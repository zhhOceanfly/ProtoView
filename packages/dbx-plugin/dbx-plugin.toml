schema_version = 1

[backend]
language = "go"
directory = "backend"
binary = "protoview-dbx"

[package]
include = ["assets", "ui", "runtime"]

# Call node directly — npm.cmd uses CMD, which rejects UNC cwd (`\\?\C:\...`) on Windows.
[dev]
ui_build = ["node", "run-build.js", "--ui-only"]
ui_watch = ["node", "run-build.js", "--ui-only", "--watch"]
