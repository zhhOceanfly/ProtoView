# 发布 VS Code / Cursor 扩展到 Open VSX
# 密钥：仓库 Settings → Secrets and variables → Actions → New repository secret
#   Name:  OVSX_PAT
#   Value: open-vsx.org → User Settings → Access Tokens 创建的 token（ovsxat_...）
#
# 触发（与 npm / DBX 分开，勿共用 tag）：
#   - 手动：Actions → Publish Open VSX → Run workflow
#   - Tag：git tag ext-v0.1.5 && git push origin ext-v0.1.5
#
# 版本以根目录 package.json 的 version 为准（tag 仅作触发）。

name: Publish Open VSX

on:
  workflow_dispatch:
  push:
    tags:
      - "ext-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package and publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:openvsx
