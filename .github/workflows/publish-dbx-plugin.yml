# Build unsigned DBX plugin candidates (.dbxp) on tags like v0.1.0-dbx
name: Publish DBX plugin candidates

on:
  push:
    tags:
      - "v*-dbx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/dbx-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install root deps
        working-directory: .
        run: npm ci

      - name: Build plugin
        working-directory: .
        run: npm run build:dbx

      - name: Package .dbxp
        run: npx --yes @dbx-app/plugin-cli package . --output-dir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbxp-${{ matrix.target }}
          path: |
            packages/dbx-plugin/dist/*.dbxp
            packages/dbx-plugin/dist/*.artifact.json

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundled
          pattern: dbxp-*
          merge-multiple: true

      - name: Collect release-candidates.json
        id: meta
        run: |
          set -euo pipefail
          mkdir -p out-release
          cp bundled/*.dbxp bundled/*.artifact.json out-release/ || true
          python3 <<'PY'
          import json, glob, os, hashlib
          from pathlib import Path
          root = Path("out-release")
          files = sorted(root.glob("*.dbxp"))
          if not files:
              raise SystemExit("no .dbxp files")
          # Prefer CLI-generated artifact json when present
          targets = []
          version = None
          plugin_id = None
          for dbxp in files:
              art = Path(str(dbxp) + "").with_suffix("").name  # strip .dbxp via name parse
              # expect name: <id>-<version>-<target>.dbxp
              name = dbxp.name
              if not name.endswith(".dbxp"):
                  continue
              stem = name[:-5]
              # find matching artifact.json
              art_path = root / f"{stem}.artifact.json"
              sha = hashlib.sha256(dbxp.read_bytes()).hexdigest()
              size = dbxp.stat().st_size
              target = "unknown"
              if art_path.exists():
                  data = json.loads(art_path.read_text(encoding="utf-8"))
                  target = data.get("target") or target
                  version = version or data.get("version")
                  plugin_id = plugin_id or data.get("id")
                  sha = data.get("sha256") or sha
                  size = int(data.get("size") or size)
              else:
                  # parse target from filename suffix
                  parts = stem.rsplit("-", 2)
                  if len(parts) >= 3:
                      target = parts[-1] if parts[-2][0].isdigit() is False else "-".join(parts[-2:])
                      # better: last segment after version
                      # id may contain dots; version is semver; target is last token(s)
                      import re
                      m = re.match(r"^(?P<id>.+)-(?P<ver>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)(-(?P<tgt>.+))?$", stem)
                      if m:
                          plugin_id = plugin_id or m.group("id")
                          version = version or m.group("ver")
                          target = m.group("tgt") or target
              tag = os.environ.get("GITHUB_REF_NAME", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "zhhOceanfly/ProtoView")
              url = f"https://github.com/{repo}/releases/download/{tag}/{dbxp.name}"
              targets.append({
                  "target": target,
                  "url": url,
                  "sha256": sha,
                  "size": size,
              })
          if not plugin_id:
              plugin_id = "io.github.zhhoceanfly.protoview"
          if not version:
              version = "0.0.0"
          doc = {
              "schemaVersion": 1,
              "id": plugin_id,
              "version": version,
              "targets": targets,
          }
          (root / "release-candidates.json").write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(doc, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out-release/*
          generate_release_notes: true
          body: |
            Unsigned DBX plugin candidates for store review.

            Install locally only with **Allow unsigned development packages** enabled.
            Official marketplace listing requires a PR to `t8y2/dbx-store` (see `packages/dbx-plugin/PUBLISH-DBX.md`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
