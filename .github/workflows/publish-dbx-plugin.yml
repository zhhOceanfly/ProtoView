# Build unsigned DBX plugin candidates (.dbxp)
# 触发（与 Open VSX / npm 分开，勿共用 tag）：
#   - Tag：git tag dbx-v0.1.0 && git push origin dbx-v0.1.0
#   - 手动：Actions → Publish DBX plugin candidates → Run workflow
# 版本以 packages/dbx-plugin/manifest.json 为准。
name: Publish DBX plugin candidates

on:
  push:
    tags:
      - "dbx-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/dbx-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install root deps
        working-directory: .
        run: npm ci

      - name: Build plugin
        working-directory: .
        run: npm run build:dbx

      # Go stamps vcs.modified=true if tracked files changed during build (e.g. rewriting
      # runtime/package.json). Store review rejects dirty VCS. Assert clean + allow
      # only gitignored build outputs before compiling the launcher.
      - name: Assert git tree clean for Go VCS stamp
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree dirty before package — Go would stamp vcs.modified=true:"
            git status --porcelain
            exit 1
          fi

      - name: Package .dbxp
        run: npx --yes @dbx-app/plugin-cli package . --output-dir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbxp-${{ matrix.target }}
          path: |
            packages/dbx-plugin/dist/*.dbxp
            packages/dbx-plugin/dist/*.artifact.json

  # Matrix 里只要有一台成功就要发 Release（Linux/mac 失败时 Windows 仍应上架候选包）。
  # needs.package 在部分矩阵失败时 result=failure，必须用 always()，否则整段 release 会被跳过，
  # 产物只留在 Actions Artifact，不会出现在 GitHub Releases。
  release:
    needs: package
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundled
          pattern: dbxp-*
          merge-multiple: true
          # 部分平台失败时仍下载已成功的 artifact
        continue-on-error: false

      - name: Collect release-candidates.json
        id: meta
        run: |
          set -euo pipefail
          mkdir -p out-release
          shopt -s nullglob
          if compgen -G "bundled/*.dbxp" > /dev/null; then
            cp bundled/*.dbxp out-release/
          fi
          if compgen -G "bundled/*.artifact.json" > /dev/null; then
            cp bundled/*.artifact.json out-release/
          fi
          if ! compgen -G "out-release/*.dbxp" > /dev/null; then
            echo "No .dbxp artifacts downloaded — all package matrix jobs failed?"
            ls -laR bundled || true
            exit 1
          fi
          python3 <<'PY'
          import json, glob, os, hashlib
          from pathlib import Path
          root = Path("out-release")
          files = sorted(root.glob("*.dbxp"))
          if not files:
              raise SystemExit("no .dbxp files")
          # Prefer CLI-generated artifact json when present
          targets = []
          version = None
          plugin_id = None
          for dbxp in files:
              art = Path(str(dbxp) + "").with_suffix("").name  # strip .dbxp via name parse
              # expect name: <id>-<version>-<target>.dbxp
              name = dbxp.name
              if not name.endswith(".dbxp"):
                  continue
              stem = name[:-5]
              # find matching artifact.json
              art_path = root / f"{stem}.artifact.json"
              sha = hashlib.sha256(dbxp.read_bytes()).hexdigest()
              size = dbxp.stat().st_size
              target = "unknown"
              if art_path.exists():
                  data = json.loads(art_path.read_text(encoding="utf-8"))
                  target = data.get("target") or target
                  version = version or data.get("version")
                  plugin_id = plugin_id or data.get("id")
                  sha = data.get("sha256") or sha
                  size = int(data.get("size") or size)
              else:
                  # parse target from filename suffix
                  parts = stem.rsplit("-", 2)
                  if len(parts) >= 3:
                      target = parts[-1] if parts[-2][0].isdigit() is False else "-".join(parts[-2:])
                      # better: last segment after version
                      # id may contain dots; version is semver; target is last token(s)
                      import re
                      m = re.match(r"^(?P<id>.+)-(?P<ver>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)(-(?P<tgt>.+))?$", stem)
                      if m:
                          plugin_id = plugin_id or m.group("id")
                          version = version or m.group("ver")
                          target = m.group("tgt") or target
              tag = os.environ.get("GITHUB_REF_NAME", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "zhhOceanfly/ProtoView")
              url = f"https://github.com/{repo}/releases/download/{tag}/{dbxp.name}"
              targets.append({
                  "target": target,
                  "url": url,
                  "sha256": sha,
                  "size": size,
              })
          if not plugin_id:
              plugin_id = "io.github.zhhoceanfly.protoview"
          if not version:
              try:
                  import pathlib
                  man = json.loads(pathlib.Path("packages/dbx-plugin/manifest.json").read_text(encoding="utf-8"))
                  version = man.get("version") or "0.0.0"
                  plugin_id = man.get("id") or plugin_id
              except Exception:
                  version = "0.0.0"
          doc = {
              "schemaVersion": 1,
              "id": plugin_id,
              "version": version,
              "targets": targets,
          }
          (root / "release-candidates.json").write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(doc, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DBX plugin ${{ github.ref_name }}
          files: out-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Unsigned DBX plugin candidates for store review.

            Install locally only with **Allow unsigned development packages** enabled.
            Official marketplace listing requires a PR to `t8y2/dbx-store` (see `packages/dbx-plugin/PUBLISH-DBX.md`).

            Partial platform builds are OK: only successfully packaged targets are attached.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
