syntax = "proto3";

package Tracking;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Tracking";
option csharp_namespace = "Shared.Proto.Tracking";

import "MetaInf.proto";
import "Tracking.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //内部查询官网pv/uv数据
  rpc ReqInternalOfficialPvUvData(OfficialPvUvDataReq) returns (OfficialPvUvDataResp){
     option (MetaInf.Meta) = {
       SessionConfig: {
         Rand: {}
       },
     };
   };
}

/** **************** message **************** **/

message OfficialPvUvDataReq {
  int32 start_date = 1; //开始日期
  int32 end_date = 2; //结束日期
}
message OfficialPvUvDataResp {
  RespCode result = 1; //结果
  repeated DailyPvUvData data_list = 2; //数据列表
}
message DailyPvUvData {
  int32 stat_date = 1; //统计日期
  int32 pv = 2; //pv
  int32 uv = 3; //uv
}