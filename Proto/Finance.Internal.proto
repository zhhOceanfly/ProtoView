syntax = "proto3";

package Finance;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Finance";
option csharp_namespace = "Shared.Proto.Finance";

import "MetaInf.proto";
import "Finance.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //pod一致性检查 
  rpc ReqInternalPodConsistCheck(Empty) returns (InternalPodConsistCheckResp){
    option (MetaInf.Meta) = {
      Mem: Read,
      SessionConfig: {
        UserMod: {}
      }
    };
  };

  //初始化货币
  // rpc ReqInitPlayerCurrency(Empty) returns (InitPlayerCurrencyResp){
  //   option (MetaInf.Meta) = {
  //     SessionConfig: {
  //       UserMod: {}
  //     }
  //   };
  // };
  //批量玩家货币变动处理-暂时废弃
  // rpc ReqMultiPlayerCurrencyChange(MultiPlayerCurrencyChangeReq) returns (MultiPlayerCurrencyChangeResp){
  //   option (MetaInf.Meta) = {
  //     ConsistCheck: true,
  //     SessionConfig: {
  //       UserMod: {}
  //     },
  //   };
  // };
  //货币变动处理
  rpc ReqPlayerCurrencyChange(PlayerCurrencyChangeReq) returns (PlayerCurrencyChangeResp){
    option (MetaInf.Meta) = {
      ConsistCheck: true,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      Idempotent: {
        Verify: true,
        CacheTime: 60
      }
    };
  };
  //充值发货（Pay回调转发）
  rpc ReqInternalRechargeDeliver(InternalRechargeDeliverReq) returns (InternalRechargeDeliverResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      Idempotent: {
        Verify: true,
        CacheTime: 300
      }
    };
  };
  //充值退款（超管原路退款，异步语义：受理置退款中，轮询收敛终态）
  rpc ReqInternalRechargeRefund(InternalRechargeRefundReq) returns (InternalRechargeRefundResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
      Idempotent: {
        Verify: true,
        CacheTime: 60
      }
    };
  };
  //充值退款通知（Pay转发中信退款通知，实时收敛5→6，轮询兜底）
  rpc ReqInternalRechargeRefundNotify(InternalRechargeRefundNotifyReq) returns (InternalRechargeRefundNotifyResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      Idempotent: {
        Verify: true,
        CacheTime: 300
      }
    };
  };
  //充值订单列表（超管后台查询，Mem读）
  rpc ReqInternalRechargeOrderList(InternalRechargeOrderListReq) returns (InternalRechargeOrderListResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Mem: Read,
      SessionConfig: {
        Rand: {}
      }
    };
  };
}

/** **************** message **************** **/

//一致性检查响应
message InternalPodConsistCheckResp {
  RespCode Result = 1; //结果
  repeated PodConsistCache CacheList = 2; //缓存列表
}
//一致性缓存
message PodConsistCache {
  string Name = 1; //缓存名称
  bool Cached = 2; //是否缓存
  bytes Data = 3; //数据
}

//初始化玩家货币响应体
message InitPlayerCurrencyResp {
  RespCode Result = 1; //结果
}

//批量玩家货币变动请求体
message MultiPlayerCurrencyChangeReq {
  repeated int64 PlayerIds = 1 [jstype = JS_STRING]; //玩家id列表
  repeated CurrencyChangeData List = 2; //变动列表
}
//批量玩家货币变动响应体
message MultiPlayerCurrencyChangeResp {
  RespCode Result = 1; //结果
  repeated FailurePlayerData FailureList = 2; //失败列表
}

//玩家货币变动请求体
message PlayerCurrencyChangeReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  repeated CurrencyChangeData List = 2; //变动列表
}
//玩家货币变动响应体
message PlayerCurrencyChangeResp {
  RespCode Result = 1; //结果
}

//充值发货请求体（Pay回调携带中信通知关键字段）
message InternalRechargeDeliverReq {
  string OrderNo = 1; //游戏侧订单号，对应中信outTradeNo
  string TransactionId = 2; //中信支付订单号
  string OutTransactionId = 3; //第三方支付订单号
  string TradeType = 4; //交易类型
  int32 TotalFee = 5; //实付金额，单位分，用于与订单金额核对
  string NotifyType = 6; //通知类型：pay-支付 refund-退款
  string OutRefundNo = 7; //商户退款单号，退款通知携带
}
//充值发货响应体
message InternalRechargeDeliverResp {
  RespCode Result = 1; //结果
}
//充值退款请求体（仅已发货整单原路退：RefundAmount必须等于订单Amount；超管原路退款，不扣发货货币）
message InternalRechargeRefundReq {
  string OrderNo = 1; //游戏侧订单号
  int32 RefundAmount = 2; //退款金额，单位分，必须等于订单金额
  int64 RefundOpId = 3; //发起退款的运营账号id
}
//充值退款响应体
message InternalRechargeRefundResp {
  RespCode Result = 1; //结果
}
//充值退款通知请求体（Pay转发中信退款通知；只改状态不回退物品，见DeliverRechargeRefundNotify注释）
message InternalRechargeRefundNotifyReq {
  string OrderNo = 1; //游戏侧订单号，对应中信outTradeNo
  string OutRefundNo = 2; //商户退款单号，对单幂等
  string RefundId = 3; //平台退款单号
  string RefundStatus = 4; //退款状态原文：SUCCESS/FAIL/PROCESSING/CHANGE
}
//充值退款通知响应体
message InternalRechargeRefundNotifyResp {
  RespCode Result = 1; //结果
}
//充值订单列表请求体（超管后台查询）
message InternalRechargeOrderListReq {
  int32 PageNumber = 1; //页码，从1开始
  int32 PageSize = 2; //每页条数
  string OrderNo = 3; //按订单号精确过滤，空为不过滤
  int64 PlayerId = 4 [jstype = JS_STRING]; //按玩家id过滤，0为不过滤
  RechargeOrderState State = 5; //按状态过滤，UNKNOWN为不过滤
}
//充值订单列表响应体
message InternalRechargeOrderListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页条数
  int32 Total = 4; //总数
  repeated RechargeOrderInfo Orders = 5; //订单列表
}
