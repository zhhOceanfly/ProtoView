/** **************** message **************** **/

//玩家注册请求体
message RegisterReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  string ConfirmPassword = 3; //确认密码
  string Name = 4; //昵称
  string HeadImg = 5; //头像
  GameChannel Channel = 6; //渠道
  string DeviceId = 7; //设备Id
  string MacAddr = 8; //Mac地址
  string Phone = 9; //手机号
  string Email = 10; //邮箱
  string VerifyCode = 11; //验证码
}
//玩家注册响应体
message RegisterResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
  string PresetToken = 3; //预分配token
}
//玩家数据
message PlayerData {
  string Account = 1; //账户名
  string Name = 2; //昵称
  string HeadImg = 3; //头像
  string DisplayId = 4; //显示id
  string Phone = 5; //手机号
  string Email = 6; //邮箱
  string Setting = 7; //设置
  bool NeedIdentity = 8; //是否需要实名认证
  int64 PlayerId = 9 [jstype = JS_STRING]; //玩家id
  repeated PlayerDeviceData DeviceList = 10; //设备列表
  MetaInf.ClientRole RoleId = 11; //角色id
}

//玩家登录请求体
message LoginReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  string ConfirmPassword = 3; //确认密码
  string Name = 4; //昵称
  string HeadImg = 5; //头像
  GameChannel Channel = 6; //渠道
  string DeviceId = 7; //设备Id
  string MacAddr = 8; //Mac地址
  string Phone = 9; //手机号
  string Email = 10; //邮箱
  string VerifyCode = 11; //验证码
}
//玩家登录响应体
message LoginResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
  string PresetToken = 3; //预分配token
}


//发送验证码请求体
message SendVerifyCodeReq {
  string Account = 1; //账户名
  GameChannel Channel = 2; //渠道
  VerifyCodeScene Scene = 3; //验证码场景
}
//发送验证码响应体
message SendVerifyCodeResp {
  RespCode Result = 1; //结果
}

//手机号或邮箱账号注册请求体
message AccountRegisterReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  string ConfirmPassword = 3; //确认密码
  string VerifyCode = 4; //验证码
  GameChannel Channel = 5; //渠道
  string DeviceId = 6; //设备Id
  string MacAddr = 7; //Mac地址
}
//手机号或邮箱账号注册响应体
message AccountRegisterResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
  string PresetToken = 3; //预分配token
}

//手机号或邮箱登录请求体
message AccountLoginReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  GameChannel Channel = 3; //渠道
  string DeviceId = 4; //设备Id
  string MacAddr = 5; //Mac地址
}
//手机号或邮箱登录响应体
message AccountLoginResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
  string PresetToken = 3; //预分配token
  int32 LoginBeforeLocked = 4; //剩余登录密码错误锁定次数
}

//绑定手机请求体
message PlayerBindPhoneReq {
  string Phone = 1; //手机号
  string VerifyCode = 2; //验证码
}
//绑定手机响应体
message PlayerBindPhoneResp {
  RespCode Result = 1; //结果
}

//绑定邮箱请求体
message PlayerBindEmailReq {
  string Email = 1; //邮箱
  string VerifyCode = 2; //验证码
}
//绑定邮箱响应体
message PlayerBindEmailResp {
  RespCode Result = 1; //结果
}

//注册登录设置响应体
message RegisterLoginSettingResp {
  RespCode Result = 1; //结果
  RegisterLoginSetting Setting = 2; //注册登录设置
}
message RegisterLoginSetting {
  bool PhoneVerifyEnabled = 1; //是否开启手机号校验
  bool EmailVerifyEnabled = 2; //是否开启邮箱校验
  bool RealNameVerifyEnabled = 3; //是否开启实名认证校验
  int32 VerifyCodeDaySendMaxNum = 4; //验证码单日发送次数上限，0表示不限制
  bool OfficialLoginEnabled = 5; //是否开启官方登录
  bool SteamLoginEnabled = 6; //是否开启steam登录
  bool WebsiteLoginEnabled = 7; //是否开启官网登录
  bool LauncherLoginEnabled = 8; //是否开启启动器登录
  bool WeChatLoginEnabled = 9; //是否开启微信登录
  bool DouyinLoginEnabled = 10; //是否开启抖音登录
}

//后台保存注册登录设置请求体
message ManageSaveRegisterLoginSettingReq {
  RegisterLoginSetting Setting = 1; //注册登录设置
}

//后台保存注册登录设置响应体
message ManageSaveRegisterLoginSettingResp {
  RespCode Result = 1; //结果
}

//玩家信息响应体
message PlayerInfoResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
}

//获取玩家信息请求体
message GetPlayerInfoReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string DisplayId = 2; //显示id
}
//获取玩家信息响应体
message GetPlayerInfoResp {
  RespCode Result = 1; //结果
  PlayerData PlayerInfo = 2; //玩家数据
}


//玩家实名认证请求体
message IdentityReq {
  string RealName = 1; //真实姓名
  string RealIdCard = 2; //身份证号
}
//玩家实名认证响应体
message IdentityResp {
  RespCode Result = 1; //结果
}

//玩家修改密码请求体
message ModifyPasswordReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  string ConfirmPassword = 3; //确认密码
  string RealIdCard = 4; //身份证
  string RealName = 5; //名字
  GameChannel Channel = 6; //渠道
}
//玩家修改密码响应体
message ModifyPasswordResp {
  RespCode Result = 1; //结果
}

//玩家忘记密码重置请求体
message ResetPasswordReq {
  string Account = 1; //账户名
  string VerifyCode = 2; //验证码
  string NewPassword = 3; //新密码
  string ConfirmPassword = 4; //确认新密码
}
//玩家忘记密码重置响应体
message ResetPasswordResp {
  RespCode Result = 1; //结果
}

//玩家查看设置响应体
message PlayerSettingResp {
  RespCode Result = 1; //结果
  string Setting = 2;
}
//玩家更新设置请求体
message UpdateSettingReq {
  string Setting = 1;
}
//玩家更新设置响应体
message UpdateSettingResp {
  RespCode Result = 1; //结果
}

//获取封禁玩家列表请求体
message ManageBanPlayerListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  int64 PlayerId = 3 [jstype = JS_STRING]; //玩家id
}
//获取封禁玩家列表响应体
message ManageBanPlayerListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated BanPlayerData PlayerList = 5; //封禁玩家列表
}
//获取封禁玩家信息请求体
message ManageBanPlayerInfoReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
}
//获取封禁玩家信息响应体
message ManageBanPlayerInfoResp {
  RespCode Result = 1; //结果
  BanPlayerData PlayerInfo = 2; //封禁玩家信息
}
//封禁玩家数据
message BanPlayerData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string Account = 2; //账户名
  string Name = 3; //昵称
  string DisplayId = 4; //显示id
  bool IsBanned = 5; //是否封禁
  int32 BanTime = 6; //封禁时间
  string BanReason = 7; //封禁原因
  string BanOperator = 8; //封禁操作人
  repeated PlayerDeviceData DeviceList = 9; //设备列表
}
//封禁玩家请求体
message ManageBanPlayerReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string BanReason = 2; //封禁原因
}
//封禁玩家响应体
message ManageBanPlayerResp {
  RespCode Result = 1; //结果
}
//解禁玩家请求体
message ManageUnbanPlayerReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
}
//解禁玩家响应体
message ManageUnbanPlayerResp {
  RespCode Result = 1; //结果
}

//获取封禁设备列表请求体
message ManageBanDeviceListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string DeviceId = 3; //设备Id
}
//获取封禁设备列表响应体
message ManageBanDeviceListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated BanDeviceData DeviceList = 5; //封禁设备列表
}
//封禁设备数据
message BanDeviceData {
  string DeviceId = 1; //设备Id
  bool IsBanned = 2; //是否封禁
  int32 BanTime = 3; //封禁时间
  string BanReason = 4; //封禁原因
  string BanOperator = 5; //封禁操作人
}
//玩家设备数据
message PlayerDeviceData {
  string DeviceId = 1; //设备Id
  string MacAddr = 2; //Mac地址
  int32 LastLoginTime = 3; //上次登录时间
  bool IsBanned = 4; //是否封禁
}
//封禁设备请求体
message ManageBanDeviceReq {
  string DeviceId = 1; //设备Id
  string BanReason = 2; //封禁原因
}
//封禁设备响应体
message ManageBanDeviceResp {
  RespCode Result = 1; //结果
}
//解禁设备请求体
message ManageUnbanDeviceReq {
  string DeviceId = 1; //设备Id
}
//解禁设备响应体
message ManageUnbanDeviceResp {
  RespCode Result = 1; //结果
}

//封禁玩家设备请求体
message ManageBanPlayerDeviceReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string BanReason = 2; //封禁原因
}
//封禁玩家设备响应体
message ManageBanPlayerDeviceResp {
  RespCode Result = 1; //结果
  repeated PlayerDeviceData DeviceList = 7; //设备列表
}
//解禁玩家设备请求体
message ManageUnbanPlayerDeviceReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
}
//解禁玩家设备响应体
message ManageUnbanPlayerDeviceResp {
  RespCode Result = 1; //结果
  repeated PlayerDeviceData DeviceList = 7; //设备列表
}
