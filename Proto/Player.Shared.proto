syntax = "proto3";

package Player;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Player";
option csharp_namespace = "Shared.Proto.Player";

/** **************** message **************** **/

message Empty {}

//获取玩家列表请求体
message PlayerListReq {
  repeated int64 PlayerIds = 1 [jstype = JS_STRING]; //玩家id列表
  string Name = 2; //玩家名称
  repeated string DisplayIds = 3; //玩家显示id列表
  bool OnlyQueryMax = 4; //是否仅查询最大
}
//获取玩家列表响应体
message PlayerListResp {
  RespCode Result = 1; //结果
  repeated PlayerCache PlayerList = 2; //玩家列表
}
//玩家缓存结构体
message PlayerCache {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string Name = 2; //昵称
  string DisplayId = 3; //显示id
  int32 CreateTime = 4; //创建时间
}

//token数据
message TokenData {
  string AccessToken = 1; //访问token
  string RefreshToken = 2; //刷新token
}
/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  EVENT_ONLINE = 1;
  EVENT_CONFIG_UPDATE = 2;
  EVENT_KICKOUT_PLAYER = 3; //踢出玩家事件
  //...
}

//上线数据结构体
message EventOnlineMsg {
  int64 timestamp = 1 [jstype = JS_STRING];
}

//配置更新事件
message ConfigUpdateEvt {
  int64 timestamp = 1 [jstype = JS_STRING];
}

//踢出玩家事件
message KickoutPlayerEvt {
  KickoutReason Reason= 1; //踢掉原因
  repeated int64 PlayerIds = 2 [jstype = JS_STRING]; //被踢出的玩家id列表
}

/** **************** timer message **************** **/

//任务类型
enum TaskType {
  TASK_UNKNOWN = 0;
  TASK_PLAYER_NUMBER = 1; //获取玩家数量
  //...
}

//获取玩家数量消息体
message PlayerNumberMsg {
  int64 PlayerId = 1 [jstype = JS_STRING];
}

/** **************** enum **************** **/

//通用响应码
enum RespCode{
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  OPERATE_LOCK_FAILURE = 7; //操作加锁失败

  /** ========= module ========= **/
  PLAYER_NOT_EXIST = 10; //玩家不存在
  REALID_CARD_LENGTH_INVALID = 11; //身份证号长度不合法
  REALID_CARD_FORMAT_INVALID = 12; //身份证号格式不合法
  REALID_CARD_AGE_INVALID = 13; //身份证号年龄不合法
  REALID_CARD_BIND_BY_SELF = 14; //身份证号已绑定
  REALID_CARD_BIND_BY_OTHER = 15; //身份证号已被其他人绑定
  PLAYER_BANNED = 16; //玩家被封禁
  PLAYER_DEVICE_BANNED = 17; //玩家设备被封禁
  PASSWORD_ERROR = 18; //密码错误
  PASSWORD_FORMAT_INVALID = 19; //密码格式不合法
  PASSWORD_LENGTH_INVALID = 20; //密码长度不合法
  ACCOUNT_FORMAT_INVALID = 21; //账户名格式不合法
  ACCOUNT_LENGTH_INVALID = 22; //账户名长度不合法
  ACCOUNT_SENSITIVE_INVALID = 23; //账户名敏感词不合法
  CONFIRM_PASSWORD_NOT_SAME = 24; //确认密码不一致
  ACCOUNT_EXIST = 25; //账户名已存在
  NAME_EXIST = 26; //昵称已存在
  NAME_FORMAT_INVALID = 27; //昵称格式不合法
  NAME_LENGTH_INVALID = 28; //昵称长度不合法
  NAME_SENSITIVE_INVALID = 29; //昵称敏感词不合法
  DISPLAY_ID_GEN_FAILURE = 30; //显示id生成失败
  PLAYER_INFO_ERROR = 31; //玩家信息错误
  PASSWORD_NO_CHANGE = 32; //密码未修改
  TOKEN_GEN_FAILURE = 33; //token生成失败
  TOKEN_NOT_SAME = 34; //token不一致
  REFRESH_TOKEN_ERROR = 35; //刷新token错误
  REFRESH_SERVER_TOKEN_ERROR = 36; //刷新服务器token错误
  PLAYER_ID_GEN_FAILURE = 37; //玩家id生成失败
  REALID_CARD_NOT_BIND = 38; //玩家身份证未绑定
  CHANNEL_INVALID = 39; //渠道不合法
  PLAYER_CHANNEL_NOT_MATCH = 40; //玩家渠道不匹配
  PLAYER_ALREADY_BANNED = 41; //玩家已封禁
  DEVICE_ALREADY_BANNED = 42; //设备已封禁
  PLAYER_ALREADY_UNBANNED = 43; //玩家已解封
  DEVICE_ALREADY_UNBANNED = 44; //设备已解封
  PHONE_FORMAT_INVALID = 45; //手机号格式不合法
  EMAIL_FORMAT_INVALID = 46; //邮箱格式不合法
  VERIFY_CODE_INVALID = 47; //验证码错误
  VERIFY_CODE_EXPIRED = 48; //验证码已过期
  VERIFY_CODE_SEND_FAILURE = 49; //验证码发送失败
  VERIFY_CODE_SEND_TOO_FREQUENT = 50; //验证码发送过于频繁
  VERIFY_CODE_SCENE_INVALID = 51; //验证码场景不合法
  PHONE_VERIFY_DISABLED = 52; //手机号校验未开启
  EMAIL_VERIFY_DISABLED = 53; //邮箱校验未开启
  EMAIL_EXIST = 54; //邮箱已存在
  VERIFY_CODE_DAY_SEND_MAX_NUM = 55; //验证码发送最大次数
  PLAYER_REALID_CARD_BINDED = 56; //玩家身份证已绑定
  PLAYER_ALREADY_EXIST = 57; //玩家已存在
  RESET_PASSWORD_FAILED = 58; //重置密码失败
  SMS_CONFIG_NOT_FOUND = 59; //短信配置未找到
  EMAIL_CONFIG_NOT_FOUND = 60; //邮箱配置未找到
  EMAIL_ADDRESS_VERIFY_INVALID = 61; //邮箱地址校验不合法
  REAL_NAME_ENTRY_CLOSED = 62; //实名认证入口已关闭
