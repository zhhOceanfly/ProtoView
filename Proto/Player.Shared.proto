  LOGIN_CHANNEL_DISABLED = 64; //登录渠道未开放
  REAL_NAME_AUTH_DAY_MAX_NUM = 65; //实名认证每日最大次数
  PASSWORD_NOT_SET = 66; //未设置密码
  PHONE_ALREADY_BOUND = 67; //手机号已被绑定
  EMAIL_ALREADY_BOUND = 68; //邮箱已被绑定
  OAUTH_ALREADY_BOUND = 69; //第三方身份已绑定其他账号
  OAUTH_PROVIDER_ALREADY_BOUND = 70; //该账号已绑定该第三方
  OAUTH_EXCHANGE_FAILURE = 71; //第三方换票失败
  OAUTH_LAST_LOGIN_METHOD = 72; //不能解绑最后一种登录方式
  OAUTH_LOGIN_DISABLED = 73; //该第三方登录未开放
  OAUTH_PROVIDER_INVALID = 74; //第三方类型不合法
  OAUTH_NOT_BOUND = 75; //未绑定该第三方
  LOGIN_METHOD_INVALID = 76; //登录方式不合法

  PHONE_ALREADY_PRE_REGISTER = 100; //手机号已预约
  ACCOUNT_ALREADY_REGISTERED = 101; //账户已注册，请直接登录

}

// 封禁状态
enum BanStatus {
  BS_UNBANNED = 0; //解封
  BS_BANNED = 1; //封禁
}

//踢掉原因
enum KickoutReason {
  KR_UNKNOWN = 0; //未知
  KR_ANOTHER_LOGIN = 1; //其他人登录踢掉
  KR_SYSTEM_MAINTENANCE = 2; //系统维护
  KR_ACCOUNT_BANNED = 3; //账号被封禁
  KR_CONNECT_EXPIRED = 4; //连接过期
}

//游戏渠道
enum GameChannel {
  GC_OFFICIAL = 0; //官方exe安装包渠道
  GC_STEAM = 1; //steam渠道
  GC_WEBSITE = 2; //官网渠道
  GC_LAUNCHER = 3; //启动器渠道
}

//验证码场景
enum VerifyCodeScene {
  VCS_NONE = 0; //未指定
  VCS_REGISTER = 1; //注册
  VCS_RESET_PASSWORD = 2; //重置密码
  VCS_BIND = 3; //绑定手机或邮箱
}

//第三方身份源
enum OAuthProvider {
  OP_NONE = 0; //未指定
  OP_WECHAT = 1; //微信
  OP_DOUYIN = 2; //抖音
  OP_STEAM = 3; //Steam
  OP_PHONE = 4; //手机号
  OP_EMAIL = 5; //邮箱
}
