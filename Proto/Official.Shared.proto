syntax = "proto3";

package Official;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Official";
option csharp_namespace = "Shared.Proto.Official";

/** **************** message **************** **/

message Empty {}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
}

/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  OPERATE_LOCK_FAILURE = 7; //操作加锁失败
  //...
  VERIFY_CODE_DAY_SEND_MAX_NUM = 10; //验证码发送最大次数
  PHONE_FORMAT_INVALID = 11; //手机号格式不合法
  VERIFY_CODE_INVALID = 12; //验证码错误
  VERIFY_CODE_EXPIRED = 13; //验证码已过期
  VERIFY_CODE_SEND_FAILURE = 14; //验证码发送失败
  VERIFY_CODE_SEND_TOO_FREQUENT = 15; //验证码发送过于频繁
  PHONE_ALREADY_PRE_REGISTER = 16; //手机号已预约
  SMS_CONFIG_NOT_FOUND = 17; //短信配置未找到
  TAPTAP_SIGN_VERIFY_FAILURE = 18; //taptap签名验签失败
}

//验证码场景
enum VerifyCodeScene {
  VCS_NONE = 0; //未指定
  VCS_PRE_REGISTER = 1; //预约游戏
}

//预约游戏来源
enum PreRegisterSource {
  PRS_OTHER = 0; //其他
  PRS_OFFICIAL = 1; //官网
  PRS_DOUYIN = 2; //抖音
}
