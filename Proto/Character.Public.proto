syntax = "proto3";

package Character;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Character";
option csharp_namespace = "Shared.Proto.Character";

import "MetaInf.proto";
import "Character.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  //玩家请求可选创建角色列表
  rpc ReqPlayerSelectedCharacterList(Empty) returns (PlayerSelectedCharacterListResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求创建角色校验
  rpc ReqCreateCharacterVerify(CreateCharacterVerifyReq) returns (CreateCharacterVerifyResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求玩家角色列表
  rpc ReqPlayerCharacterList(Empty) returns (PlayerCharacterListResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求选取角色存档校验
  rpc ReqUseCharacterVerify(UseCharacterVerifyReq) returns (UseCharacterVerifyResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };

  //请求皮肤商城列表
  rpc ReqShoppingList(Empty) returns (ShoppingListResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求玩家皮肤列表
  rpc ReqPlayerClothList(Empty) returns (PlayerClothListResp){
    option (MetaInf.Meta) = {
      Mem: Read,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求玩家购买皮肤
  rpc ReqPlayerPurchaseCloth(PlayerPurchaseClothReq) returns (PlayerPurchaseClothResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
}

/** **************** message **************** **/

//玩家创建角色校验请求体
message CreateCharacterVerifyReq {
  int32 CharacterId = 1; //角色id
  repeated int32 ClothIds = 2; //所选皮肤id列表
}
//玩家创建角色校验响应体
message CreateCharacterVerifyResp {
  RespCode Result = 1; //结果
  int64 CharacterAid = 2 [jstype = JS_STRING]; //角色存档id
}

//玩家可选创建角色列表响应体
message PlayerSelectedCharacterListResp {
  RespCode Result = 1; //结果
  repeated CharacterSelectedData CharacterList = 2; //角色列表
}

//玩家选取角色校验请求体
message UseCharacterVerifyReq {
  int64 CharacterAid = 1 [jstype = JS_STRING]; //角色存档id
  int64 SelectedCharacterAid = 2 [jstype = JS_STRING]; //选取的角色库存id
}
//玩家选取角色校验响应体
message UseCharacterVerifyResp {
  RespCode Result = 1; //结果
}

//玩家角色列表响应体
message PlayerCharacterListResp {
  RespCode Result = 1; //结果
  repeated CharacterData CharacterList = 2; //角色列表
  int32 ArchiveMaxNumber = 3; //存档最大数量
}

//皮肤商城列表响应体
message ShoppingListResp {
  RespCode Result = 1; //结果
  repeated ShoppingData List = 2; //商城列表
}

//玩家皮肤列表响应体
message PlayerClothListResp {
  RespCode Result = 1; //结果
  repeated int32 ClothIds = 2; //皮肤id列表
}

//玩家购买皮肤响应体
message PlayerPurchaseClothReq {
  int32 CurrencyId = 1; //购买货币id
  int32 ShoppingId = 2; //商品id
}
//玩家购买皮肤响应体
message PlayerPurchaseClothResp {
  RespCode Result = 1; //结果
}