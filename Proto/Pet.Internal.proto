syntax = "proto3";

package Pet;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Pet";
option csharp_namespace = "Shared.Proto.Pet";

import "MetaInf.proto";
import "Pet.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  // 内部查询当前穿戴的无人机
  rpc ReqInternalEquippedDrone(Empty) returns (InternalEquippedDroneResp) {
    option (MetaInf.Meta) = { SessionConfig: { UserMod: {} } };
  }
  // 内部新增玩家无人机
  rpc ReqInternalAddPlayerDrone(InternalAddPlayerDroneReq) returns (InternalAddPlayerDroneResp) {
    option (MetaInf.Meta) = { SessionConfig: { UserMod: {} } };
  }
  // 捕获宠物接口
  rpc ReqInternalCapturePet(InternalCapturePetReq) returns (InternalCapturePetResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }
  // 领取宠物接口
  rpc ReqInternalReceivePet(InternalReceivePetReq) returns (InternalReceivePetResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }
  // 放生宠物接口
  rpc ReqInternalReleasePet(InternalReleasePetReq) returns (InternalReleasePetResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }

  // 修改玩家同行宠物
  rpc ReqInternalModifyPlayerPeerPet(InternalModifyPlayerPeerPetReq) returns (InternalModifyPlayerPeerPetResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }
  // 获取玩家同行宠物
  rpc ReqInternalGetPlayerPeerPet(Empty) returns (InternalGetPlayerPeerPetResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }

  // 宠物培养接口
  rpc ReqInternalStartPetRaising(StartPetRaisingReq) returns (StartPetRaisingResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }

  // 同步宠物属性变化
  rpc ReqInternalSyncPetData(InternalSyncPetDataReq) returns (InternalSyncPetDataResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  }
}

// 内部新增玩家无人机请求体
message InternalAddPlayerDroneReq {
  int32 DroneId = 1; // 无人机配置id，同型号重复新增不重复写入
}
// 内部新增玩家无人机响应体
message InternalAddPlayerDroneResp {
  RespCode Result = 1; // 处理结果
}

/** **************** message **************** **/

// 捕获宠物请求体
message InternalCapturePetReq {
  int32 PetConfigId = 1; // 宠物配置id
  int32 GoodsId = 2; // 捕捉道具id
}
// 捕获宠物响应体
message InternalCapturePetResp {
  RespCode Result = 1; // 结果
  PetData PetInfo = 2; //宠物信息
}

// 领取宠物请求体
message InternalReceivePetReq {
  int32 PetConfigId = 1; // 宠物配置id
}
// 领取宠物响应体
message InternalReceivePetResp {
  RespCode Result = 1; // 结果
}

// 放生宠物请求体
message InternalReleasePetReq {
  int64 PetId = 1 [jstype = JS_STRING]; // 宠物唯一ID
}
// 放生宠物响应体
message InternalReleasePetResp {
  RespCode Result = 1; // 结果
}

// 修改玩家同行宠物请求体
message InternalModifyPlayerPeerPetReq {
  int64 ChangePetId = 1 [jstype = JS_STRING]; // 改变的宠物唯一ID
  int32 TargetSlotId = 2; // 目标宠物槽位
  int32 CurPeerPetExp = 3; // 同行宠物当前经验
  int32 CurPeerPetHp = 4; // 同行宠物当前血量
}
// 修改玩家同行宠物响应体
message InternalModifyPlayerPeerPetResp {
  RespCode Result = 1; // 结果
  PetData PeerPet = 2; //同行宠物
}

// 获取玩家同行宠物响应体
message InternalGetPlayerPeerPetResp {
  RespCode Result = 1; // 结果
  PetData PetInfo = 2; //宠物信息
}

// 宠物培养请求体
message StartPetRaisingReq {
  int64 PetId = 1 [jstype = JS_STRING]; // 宠物唯一ID
  RaisingType RaisingType = 2; // 宠物培养类型
  int32 RaisingSlot = 3; // 培养槽位
  int32 CurExp = 4; // 当前经验
  int32 CurHp = 5; // 当前血量
  int32 RaisedExp = 6; //培育后经验
  int32 RaisedHp = 7; //培育后血量
  RaisingCost RaisingCost = 8; // 消耗道具
  int32 RaisingTime = 9; // 培养时间
}
// 宠物培养响应体
message StartPetRaisingResp {
  RespCode Result = 1; // 结果
  PetRaisingData RaisingInfo = 2; // 培养数据
}

// 同步宠物属性变化请求体
message InternalSyncPetDataReq {
  int64 PetId = 1 [jstype = JS_STRING]; // 宠物ID
  int32 CurExp = 2; // 当前经验
  int32 CurHp = 3; // 当前血量
}
// 同步宠物属性变化响应体
message InternalSyncPetDataResp {
  RespCode Result = 1; // 结果
}

// 内部查询当前穿戴无人机响应体
message InternalEquippedDroneResp {
  RespCode Result = 1; // 处理结果
  DroneData Drone = 2; // 当前穿戴无人机，未穿戴时为空
}
