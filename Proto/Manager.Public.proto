/** **************** message **************** **/

//登录请求体
message LoginReq {
  string Name = 1;
  string Password = 2;
}
//登录响应体
message LoginResp {
  RespCode Result = 1; //结果
  AcctData AcctInfo = 2; //账户数据
  TokenData TokenInfo = 3; //token数据
}

//登出响应体
message LogoutResp {
  RespCode Result = 1; //结果
}

//账户列表请求体
message AccountListReq {
  int32 PageNumber = 1;
  int32 PageSize = 2;
  string Name = 3;
}
//账户列表响应体
message AccountListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2;
  int32 PageSize = 3;
  int32 Total = 4;
  repeated AcctData AcctList = 5; //账户列表
}

//添加账户请求体
message AddAccountReq {
  string Name = 1; //账户名
  string Nickname = 2; //昵称
  string Phone = 3; //手机号
  string Password = 4; //密码
  MetaInf.ManagerRole RoleId = 5; //角色id
}
//添加账户响应体
message AddAccountResp {
  RespCode Result = 1; //结果
}

//修改账户请求体
message UpdateAccountReq {
  int64 AcctId = 1 [jstype = JS_STRING]; //账户id
  string Name = 2; //账户名
  string Nickname = 3; //昵称
  string Phone = 4; //手机号
  string Password = 5; //密码
  MetaInf.ManagerRole RoleId = 6; //角色id
}
//修改账户响应体
message UpdateAccountResp {
  RespCode Result = 1; //结果
}

//删除账户请求体
message DeleteAccountReq {
  int64 AcctId = 1 [jstype = JS_STRING]; //账户id
}
//删除账户响应体
message DeleteAccountResp {
  RespCode Result = 1; //结果
}

//自身账户信息响应体
message SelfAccountInfoResp {
  RespCode Result = 1; //结果
  AcctData AcctInfo = 2; //账户信息
}

//账户信息请求体
message AccountInfoReq {
  int64 AcctId = 1 [jstype = JS_STRING]; //账户id
}
//账户信息响应体
message AccountInfoResp {
  RespCode Result = 1; //结果
  AcctData AcctInfo = 2; //账户信息
}

//刷新token请求体
message RefreshTokenReq{
  string RefreshToken = 1; //刷新token
}
//刷新token响应体
message RefreshTokenResp{
  RespCode Result = 1; //结果
  TokenData TokenInfo = 2; //token数据
}

//修改密码请求体
message ModifyPasswordReq {
  string Password = 1; //原密码
  string NewPassword = 2; //新密码
  int64 AcctId = 3 [jstype = JS_STRING]; //账户id
}
//修改密码响应体
message ModifyPasswordResp {
  RespCode Result = 1; //结果
}

//进入游戏服务器请求体
message EnterGameServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
}
//进入游戏服务器响应体
message EnterGameServerResp {
  RespCode Result = 1; //结果
  TokenData TokenInfo = 2; //token数据
}

//物品列表请求体
message GoodsListReq {
  repeated int32 Categorys = 1; //分类
}
//物品列表响应体
message GoodsListResp {
  RespCode Result = 1; //结果
  repeated GoodsInfo List = 2; //物品信息列表
}

//赠送玩家物品请求体
message GivePlayerGoodsReq {
  repeated string DisplayIds = 1; //玩家显示id列表
  repeated GoodsData List = 2; //物品列表
}
//赠送玩家物品响应体
message GivePlayerGoodsResp {
  RespCode Result = 1; //结果
  repeated FailurePlayerData FailureList = 2; //失败列表
}

//后台获取分线地图列表响应体
message ServerLineMapListResp {
  RespCode Result = 1; //结果
  repeated ServerLineMapData List = 2; //分线地图列表
}
//分线地图数据
message ServerLineMapData {
  int32 MapId = 1; //地图id
  string MapName = 2; //地图名称
}

//集群服务管理列表响应体
message ControlTargetListResp {
  RespCode Result = 1; //结果
  string Namespace = 2; //Pod 所在 namespace
  repeated ControlTargetData List = 3; //可代理的业务 Pod
}
//集群服务管理目标，对齐 control targets JSON
message ControlTargetData {
  string Pod = 1; //Pod 名
  string App = 2; //app 标签
  bool Ready = 3; //是否 Ready
  string Phase = 4; //Pod 阶段
  string Ip = 5; //Pod IP
  string ProxyBase = 6; //反向代理前缀 /manager/control/proxy/{pod}
  string IndexUrl = 7; //该 Pod 控制台首页路径
}

//运维配置列表响应体
message OpsConfigListResp {
  RespCode Result = 1; //结果
  repeated OpsConfigData ConfigList = 2; //配置列表
}

//创建运维配置请求体
message CreateOpsConfigReq {
  string ConfigKey = 1; //配置键
  string ConfigJson = 2; //配置内容JSON
  bool Enabled = 3; //是否启用
  string Description = 4; //配置说明
  string ExampleJson = 5; //配置示例JSON
}
//创建运维配置响应体
message CreateOpsConfigResp {
  RespCode Result = 1; //结果
  OpsConfigData Config = 2; //配置数据
}

//更新运维配置请求体
message UpdateOpsConfigReq {
  string ConfigKey = 1; //配置键
  optional string ConfigJson = 2; //配置内容JSON，空值不更新
  optional bool Enabled = 3; //是否启用
  optional string Description = 4; //配置说明，空值不更新
  int32 ExpectedVersion = 5; //期望版本
  optional string ExampleJson = 6; //配置示例JSON，空值不更新
}
//更新运维配置响应体
message UpdateOpsConfigResp {
  RespCode Result = 1; //结果
  OpsConfigData Config = 2; //配置数据
}

//删除运维配置请求体
message DeleteOpsConfigReq {
  string ConfigKey = 1; //配置键
}
//删除运维配置响应体
message DeleteOpsConfigResp {
  RespCode Result = 1; //结果
}

//生成jwt密钥请求体
message GenerateJwtKeysReq {
  string Source = 1; //来源，如 Player / Manager
  string Kid = 2; //密钥标识，空则按 Source-时间戳 生成
  string SigningMethod = 3; //签名算法，默认 RS256
  int32 Bits = 4; //RSA 位数，默认 2048
  string Issuer = 5; //签发方
  string Organization = 6; //组织
  string Provider = 7; //提供方
  int32 StartTime = 8; //生效时间戳，0 表示当前
  int32 EndTime = 9; //失效时间戳，0 表示当前+1年
  int32 AccessExpireInSeconds = 10; //access 过期秒数，默认 3600
  int32 RefreshExpireInSeconds = 11; //refresh 过期秒数，默认 86400
}
//生成jwt密钥响应体
message GenerateJwtKeysResp {
  RespCode Result = 1; //结果
  string ServiceConfigJson = 2; //可粘贴进 Jwt/.config/jwt.json 的完整配置
  string JwksJson = 3; //可粘贴进网关 jwks 的完整配置
  string SourceConfigJson = 4; //单条 source 配置，便于合并进现有文件
}

//获取当前 jwt 配置响应体
message GetJwtConfigResp {
  RespCode Result = 1; //结果
  string JwtConfigJson = 2; //当前 Jwt/.config/jwt.json 原文
  string JwksJson = 3; //当前 Jwt/.well-known/jwks.json 原文
}

//保存 jwt 配置请求体
message SaveJwtConfigReq {
  string JwtConfigJson = 1; //完整 Jwt/.config/jwt.json
  string JwksJson = 2; //完整 Jwt/.well-known/jwks.json
}
//保存 jwt 配置响应体
message SaveJwtConfigResp {
  RespCode Result = 1; //结果
}

//后台充值订单列表请求体（仅超管）
message RechargeOrderListReq {
  int32 PageNumber = 1; //页码，从1开始
  int32 PageSize = 2; //每页条数
  string OrderNo = 3; //按订单号精确过滤，空为不过滤
  int64 PlayerId = 4 [jstype = JS_STRING]; //按玩家id过滤，0为不过滤
  int32 State = 5; //按充值订单状态过滤，0为不过滤（1待支付 2已支付 3已发货 4已关闭 5退款中 6已退款 7退款失败）
}
//后台充值订单列表响应体
message RechargeOrderListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页条数
  int32 Total = 4; //总数
  repeated RechargeOrderData Orders = 5; //订单列表
}
//后台充值订单数据
message RechargeOrderData {
  string OrderNo = 1; //游戏侧订单号
  int64 GameServerId = 2 [jstype = JS_STRING]; //游戏服id
  int64 PlayerId = 3 [jstype = JS_STRING]; //玩家id
  int32 ProductId = 4; //充值档位id
  int32 GoodsId = 5; //发货物品id
  int32 GoodsNum = 6; //发货物品数量
  int32 Amount = 7; //订单金额，单位分
  int32 State = 8; //订单状态
  int32 RefundAmount = 9; //退款金额，单位分
  string RefundNo = 10; //退款单号
  int32 PayTime = 11; //支付成功时间
  int32 DeliverTime = 12; //发货完成时间
  int32 RefundTime = 13; //退款完成时间
  int32 CreateTime = 14; //创建时间
}
//后台充值订单退款请求体（仅超管，已发货整单原路退）
message RefundRechargeOrderReq {
  string OrderNo = 1; //游戏侧订单号
  int32 RefundAmount = 2; //退款金额，单位分，必须等于订单金额
}
//后台充值订单退款响应体
message RefundRechargeOrderResp {
  RespCode Result = 1; //结果
}
