  rpc ReqLogout(Empty) returns (LogoutResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER]
      },
      ManagerRoles: [MR_Default, MR_SuperAdmin, MR_GameOperator],
      SessionConfig: {
        UserMod: {}
