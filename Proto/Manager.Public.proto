  rpc ReqBaseLogin(LoginReq) returns (LoginResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
