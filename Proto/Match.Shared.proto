  REFRESH_TOKEN_ERROR = 70; //刷新token错误
  PLAYER_BANNED = 71; //玩家被封禁
  TOKEN_GEN_FAILURE = 72; //token生成失败
  TOKEN_JTI_NOT_MATCH = 73; //token jti不匹配
  BIZ_CLIENT_GET_FAILED = 74; //biz客户端获取失败
  TOKEN_GAME_SERVER_ID_NOT_MATCH = 75; //token游戏服务器id不匹配
  GAME_SCENE_MAP_TYPE_INVALID = 76; //游戏场景地图类型不合法
  DUNGEON_CONFIG_MAP_NOT_MATCH = 77; //副本配置地图不匹配
  TEAM_DUNGEON_LIMIT = 78; //团队副本数量达到上限
  CLEAR_SCENE_BUILDING_FAILURE = 79; //清理场景建造数据失败
}

//服务器类型
enum ServerType {
  ST_OFFICIAL = 0; //官方服
  ST_STEAM = 1; //steam服
}

//在线状态
enum OnlineState {
  OS_UNKNOWN = 0; //未知
  ONLINE = 1; //在线
  OFFLINING = 2; //离线中
  OFFLINE = 3; //离线
}

//后台服务器状态
enum ManageServerState {
  SS_CLOSED = 0; //已关闭
  SS_OPENED = 1; //已开启
  SS_OPENNING = 2; //开启中
  SS_CLOSING = 3; //关闭中
  SS_DELETED = 4; //已删除
}

//离开原因
enum LeaveReason {
  LR_UNKNOWN = 0; //未知
  LR_ANOTHER_LOGIN = 1; //其他人登录踢掉
  LR_SYSTEM_MAINTENANCE = 2; //系统维护
  LR_ACCOUNT_BANNED = 3; //账号被封禁
  LR_CONNECT_EXPIRED = 4; //连接过期
  LR_NORMAL_JUMP_SCENE = 5; //正常跳转场景
  LR_NORMAL_LEAVE_SERVER = 6; //正常主动离开服务器
}

//搜索排序
enum SearchSort {
  SS_PLAYER_ID = 0; //默认玩家id
  SS_CREATE_TIME = 1; //创建时间
  SS_ONLINE_STATE = 2; //在线状态
}

//排序方向
enum SortDirection {
  SD_ASC = 0; //升序
  SD_DESC = 1; //降序
}

//游戏服模式
enum GameServerMode {
  GS_MODE_DEFAULT = 0; //默认模式
  GS_MODE_DEBUG = 1; //调试模式
}
