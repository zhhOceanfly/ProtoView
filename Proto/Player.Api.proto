syntax = "proto3";

package Player;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Player";
option csharp_namespace = "Shared.Proto.Player";

import "MetaInf.proto";
import "Player.Shared.proto";
import "google/api/annotations.proto";

/** **************** service **************** **/

service ApiService {
  //官网发送验证码
  rpc ReqBaseWebsiteSendVerifyCode(WebsiteSendVerifyCodeReq) returns (WebsiteSendVerifyCodeResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
  };
  //官网手机或邮箱账号登录
  rpc ReqBaseWebsiteAccountLogin(WebsiteAccountLoginReq) returns (WebsiteAccountLoginResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
  };
  //官网手机或邮箱账号注册
  rpc ReqBaseWebsiteAccountRegister(WebsiteAccountRegisterReq) returns (WebsiteAccountRegisterResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
  };
  //微信扫码登录
  //	tips: 微信 302 回调，仅走 Client/Api HTTP，不实现 grpc 方法；query 为 code/state
  rpc ReqBaseWeixinOAuthLogin(WeixinOAuthLoginReq) returns (WebsiteAccountLoginResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: NO_AUTH
      },
      NotTracing: true,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
    option (google.api.http) = {
    	get: "/player/base/weixin/oauth_login"
    };
  };
  //官网刷新token
  rpc ReqBaseWebsiteRefreshToken(WebsiteRefreshTokenReq) returns (WebsiteRefreshTokenResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
  };
  //获取玩家信息
  rpc ReqWebsiteGetPlayerInfo(Empty) returns (WebsiteGetPlayerInfoResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        JtiCheck: {
          ClientTtl: 0
        },
        Tags: [AU_OFFICIAL, AU_LAUNCHER]
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 2,
          BanTime: 1
        }
      }
    };
  };
  //玩家忘记密码重置
  rpc ReqBaseWebsiteResetPassword(WebsiteResetPasswordReq) returns (WebsiteResetPasswordResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: NO_AUTH
      },
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 1
        }
      }
    };
  };

}

/** **************** message **************** **/

//官网发送验证码请求体
message WebsiteSendVerifyCodeReq {
  string Account = 1; //账户名
  GameChannel Channel = 2; //渠道
  VerifyCodeScene Scene = 3; //验证码场景
}
//官网发送验证码响应体
message WebsiteSendVerifyCodeResp {
  RespCode Result = 1; //结果
}

//官网手机号或邮箱账号注册请求体
message WebsiteAccountRegisterReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  string ConfirmPassword = 3; //确认密码
  string VerifyCode = 4; //验证码
  GameChannel Channel = 5; //渠道
  string DeviceId = 6; //设备Id
  string MacAddr = 7; //Mac地址
}
//官网注册响应体
message WebsiteAccountRegisterResp {
  RespCode Result = 1; //结果
  WebsitePlayerData PlayerInfo = 2; //玩家数据
  TokenData TokenInfo = 3; //token信息
  int32 LoginBeforeLocked = 4; //剩余登录密码错误锁定次数
}
//官网手机号或邮箱登录请求体
message WebsiteAccountLoginReq {
  string Account = 1; //账户名
  string Password = 2; //密码
  GameChannel Channel = 3; //渠道
  string DeviceId = 4; //设备Id
  string MacAddr = 5; //Mac地址
}
//官网手机号或邮箱登录响应体
message WebsiteAccountLoginResp {
  RespCode Result = 1; //结果
  WebsitePlayerData PlayerInfo = 2; //玩家数据
  TokenData TokenInfo = 3; //token信息
  int32 LoginBeforeLocked = 4; //剩余登录密码错误锁定次数
}
//官网玩家数据
message WebsitePlayerData {
  string Account = 1; //账户名
  string Name = 2; //昵称
  string HeadImg = 3; //头像
  string DisplayId = 4; //显示id
  string Phone = 5; //手机号
  string Email = 6; //邮箱
  OAuthPlayerData OAuthInfo = 7; //第三方登录信息
}
//第三方登录玩家数据
message OAuthPlayerData {
  OAuthProvider Provider = 1; //身份源
  string Name = 2; //昵称
  string HeadImg = 3; //头像
}
//官网刷新token请求体
message WebsiteRefreshTokenReq {
  string RefreshToken = 1; //刷新token
}
//官网刷新token响应体
message WebsiteRefreshTokenResp {
  RespCode Result = 1; //结果
  TokenData TokenInfo = 2; //token信息
}
//官网获取玩家信息请求体
message WebsiteGetPlayerInfoReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  string DisplayId = 2; //显示id
}
//官网获取玩家信息响应体
message WebsiteGetPlayerInfoResp {
  RespCode Result = 1; //结果
  WebsitePlayerData PlayerInfo = 2; //玩家数据
}

//官网玩家忘记密码重置请求体
message WebsiteResetPasswordReq {
  string Account = 1; //账户名
  string VerifyCode = 2; //验证码
  string NewPassword = 3; //新密码
  string ConfirmPassword = 4; //确认新密码
}
//官网玩家忘记密码重置响应体
message WebsiteResetPasswordResp {
  RespCode Result = 1; //结果
}

//微信扫码登录请求体
message WeixinOAuthLoginReq {
  string code = 1; //授权码
  string state = 2; //应用授权作用域
}

