syntax = "proto3";

package Base;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Base";
option csharp_namespace = "Shared.Proto.Base";

import "MetaInf.proto";
import "Base.Shared.proto";

/** **************** service **************** **/

service InternalService {
  // 请求健康检查
  rpc ReqBaseServiceHealth(Empty) returns (ServiceHealthResp) {
    option (MetaInf.Meta) = {
    };
  }
  // 请求服务停止
  rpc ReqBaseServiceStop(Empty) returns (ServiceStopResp) {
    option (MetaInf.Meta) = {
    };
  }

  // 请求调度job
  rpc ReqBaseScheduleJob(ScheduleJobReq) returns (ScheduleJobResp) {
    option (MetaInf.Meta) = {
    };
  }
  // 请求获取job
  rpc ReqBaseGetJob(GetJobReq) returns (GetJobResp) {
    option (MetaInf.Meta) = {
    };
  }
  // 请求删除job
  rpc ReqBaseDeleteJob(DeleteJobReq) returns (DeleteJobResp) {
    option (MetaInf.Meta) = {
    };
  }
}

/** **************** message **************** **/

message ServiceHealthResp{
  RespCode Result = 1; //结果
}
message ServiceStopResp{
	RespCode Result = 1; //结果
}

//调度job请求体
message ScheduleJobReq {
  string Name = 1;
  string DueTime = 2;
  string Schedule = 3;
  string Ttl = 4;
  uint32 Repeats = 5;
  bytes payload = 6;
}
//调度job响应体
message ScheduleJobResp {
	RespCode Result = 1; //结果
}
//获取job请求体
message GetJobReq {
  string Name = 1;
}
//获取job响应体
message GetJobResp {
	RespCode Result = 1; //结果
}
//删除job请求体
message DeleteJobReq {
  string Name = 1;
}
//删除job响应体
message DeleteJobResp {
	RespCode Result = 1; //结果
}