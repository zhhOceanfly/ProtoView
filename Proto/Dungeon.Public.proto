syntax = "proto3";

package Dungeon;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Dungeon";
option csharp_namespace = "Shared.Proto.Dungeon";

import "MetaInf.proto";
import "Dungeon.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  // 玩家请求设计图列表
  rpc ReqPlayerDesignList(Empty) returns (PlayerDesignListResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  // 玩家请求重命名服务器设计图
  rpc ReqUpdatePlayerDesignName(UpdatePlayerDesignNameReq) returns (UpdatePlayerDesignNameResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  // 玩家请求删除服务器设计图
  rpc ReqDeletePlayerDesign(DeletePlayerDesignReq) returns (DeletePlayerDesignResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
}

/** **************** message **************** **/

//玩家设计图列表响应体
message PlayerDesignListResp {
  RespCode Result = 1; //结果
  repeated DesignData DesignList = 2; //设计图列表
}
//重命名玩家设计图请求体
message UpdatePlayerDesignNameReq {
  int64 DesignId = 1 [jstype = JS_STRING]; //设计图id
  string Name = 2; //名称
}
//重命名玩家设计图响应体
message UpdatePlayerDesignNameResp {
  RespCode Result = 1; //结果
}
//删除玩家设计图请求体
message DeletePlayerDesignReq {
  int64 DesignId = 1 [jstype = JS_STRING]; //设计图id
}
//删除玩家设计图响应体
message DeletePlayerDesignResp {
  RespCode Result = 1; //结果
}
