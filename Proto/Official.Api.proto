syntax = "proto3";

package Official;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Official";
option csharp_namespace = "Shared.Proto.Official";

import "MetaInf.proto";
import "Official.Shared.proto";
import "google/api/annotations.proto";

/** **************** service **************** **/

// 服务定义
service ApiService {
  //taptap预约回调
  rpc ReqBaseTaptapPreRegisterCallback(TaptapPreRegisterCallbackReq) returns (TaptapPreRegisterCallbackResp) {
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 15,
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount : 30,
          BanTime   : 1
        }
      }
    };
    option (google.api.http) = {
    	post: "/official/base/pre_register/callback"
    };
  };
}

/** **************** message **************** **/

//taptap预约回调请求
message TaptapPreRegisterCallbackReq {
  string event_id = 1; //事件id
  string event_type = 2; //事件类型
  string client_id = 3; //客户端id
  string openid = 4; //openid
  string unionid = 5; //unionid
  string reserve_type = 6; //预约类型
  string encrypted_phone = 7; //加密手机号
  int64 timestamp = 8; //时间戳
}

//taptap预约回调响应
message TaptapPreRegisterCallbackResp {
  RespCode code = 1;   // 业务返回码
  string message = 2;  // 附加信息
}
