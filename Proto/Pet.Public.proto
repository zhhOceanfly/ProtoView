  // 拖动改变宠物槽位
  rpc ReqPlayerChangePetSlot(PlayerChangePetSlotReq) returns (PlayerChangePetSlotResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
