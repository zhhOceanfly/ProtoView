  // 获取宠物培养列表
  rpc ReqGetPetRaisingList(Empty) returns (GetPetRaisingListResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
