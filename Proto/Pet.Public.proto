  // 取出培养宠物
  rpc ReqTakePetRaising(TakePetRaisingReq) returns (TakePetRaisingResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
