syntax = "proto3";

package Pet;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Pet";
option csharp_namespace = "Shared.Proto.Pet";

import "MetaInf.proto";
import "Pet.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  // 查询玩家拥有的无人机列表（包含是否穿戴）
  rpc ReqPlayerDroneList(Empty) returns (PlayerDroneListResp) {
    option (MetaInf.Meta) = {
      Mem: Read,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }
  // 穿戴无人机
  rpc ReqPlayerEquipDrone(PlayerDroneIdReq) returns (PlayerDroneResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }
  // 卸下当前无人机
  rpc ReqPlayerUnequipDrone(Empty) returns (PlayerDroneResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }
  // 获取玩家宠物列表
  rpc ReqPlayerPetList(Empty) returns (PlayerPetListResp) {
    option (MetaInf.Meta) = {
      Mem: Read,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }
  // 获取玩家宠物详情
  // rpc ReqPlayerPetDetail(PlayerPetDetailReq) returns (PlayerPetDetailResp) {
  //   option (MetaInf.Meta) = {
  //     Closed: true,
  //     Mem: Read,
  //     Timeout: 15,
  //     AuthConfig: {
  //       AuthOption: JWT_AUTH,
  //       JwtSources: [JS_PLAYER],
  //       JtiCheck: {
  //         ClientTtl: 10
  //       }
  //     },
  //     SessionConfig: {
  //       UserMod: {}
  //     },
  //     LimitConfig: {
  //       UserMethodLimit: {
  //         TimeWindow: 1,
  //         CallCount: 3,
  //         BanTime: 2
  //       }
  //     }
  //   };
  // }
  // 扩容宠物仓库容量
  rpc ReqPlayerExpandPetCapacity(Empty) returns (PlayerExpandPetCapacityResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
