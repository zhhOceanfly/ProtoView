  // 加速宠物培养接口
  rpc ReqSpeedPetRaising(SpeedPetRaisingReq) returns (SpeedPetRaisingResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
