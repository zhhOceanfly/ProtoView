        }
      }
    };
  }
}

// 穿戴无人机请求体
message PlayerDroneIdReq {
  int32 DroneId = 1; // 无人机配置id
}
// 玩家拥有的无人机列表响应体
message PlayerDroneListResp {
  RespCode Result = 1; // 处理结果
  repeated DroneData List = 2; // 无人机列表
}
// 无人机穿戴、卸下和当前穿戴查询响应体
message PlayerDroneResp {
  RespCode Result = 1; // 处理结果
  DroneData Drone = 2; // 穿戴或查询时返回当前无人机；卸下成功返回被卸下的无人机；未穿戴时为空
}

/** **************** message **************** **/

// 玩家宠物列表响应体
message PlayerPetListResp {
  RespCode Result = 1; //结果
  PetData PeerPet = 2; //同行宠物
  repeated PetData PetList = 3; //宠物仓库列表
  PetCapacityData PetCapacity = 4; //宠物仓库信息
}

// 玩家宠物详情请求体
message PlayerPetDetailReq {
  int64 PetId = 1 [jstype = JS_STRING]; //宠物唯一ID
}
// 玩家宠物详情响应体
message PlayerPetDetailResp {
  RespCode Result = 1; // 结果
  PetData PetInfo = 2; // 宠物数据
}

// 扩容宠物仓库容量响应体
message PlayerExpandPetCapacityResp {
  RespCode Result = 1; // 结果
  PetCapacityData PetCapacity = 2; // 宠物仓库信息
}

// 改变宠物槽位请求体
message PlayerChangePetSlotReq {
  int64 ChangePetId = 1 [jstype = JS_STRING]; // 改变的宠物唯一ID
  int32 TargetSlotId = 2; // 目标宠物槽位
}
// 改变宠物槽位响应体
message PlayerChangePetSlotResp {
  RespCode Result = 1; // 结果
}

// 修改宠物名称请求体
message PlayerChangePetNameReq {
  int64 PetId = 1 [jstype = JS_STRING]; //宠物唯一ID
  string Name = 2; //宠物名称
}
// 修改宠物名称响应体
message PlayerChangePetNameResp {
  RespCode Result = 1; //结果
}

// 玩家批量放生宠物请求体
message PlayerBatchReleasePetReq {
  repeated int64 PetIds = 1 [jstype = JS_STRING]; // 宠物唯一ID列表
}
// 玩家批量放生宠物响应体
message PlayerBatchReleasePetResp {
  RespCode Result = 1; // 结果
}

// 加速宠物培养请求体
message SpeedPetRaisingReq {
  int64 PetId = 1 [jstype = JS_STRING]; // 宠物唯一ID
  int32 GoodsId = 2; //加速道具id
}
// 加速宠物培养响应体
message SpeedPetRaisingResp {
  RespCode Result = 1; // 结果
  PetRaisingData RaisingInfo = 2; // 培养数据
}

// 获取宠物培养设施响应体
message GetPetRaisingListResp {
  RespCode Result = 1; // 结果
  repeated PetRaisingData List = 2; // 培养列表
}

// 取出培养宠物请求体
message TakePetRaisingReq {
  int64 PetId = 1 [jstype = JS_STRING]; // 宠物唯一ID
  bool IsCompleted = 2; // 是否已完成
}
// 取出培养宠物响应体
message TakePetRaisingResp {
  RespCode Result = 1; // 结果
  PetData PetInfo = 2; // 宠物数据
}
