syntax = "proto3";

package Base;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Base";
option csharp_namespace = "Shared.Proto.Base";

/** **************** message **************** **/

// 原始文本请求，供需要绕过 protobuf body 解码的 HTTP 接口使用。
message RawTextReq {
  string RawText = 1;
}

// 原始文本响应，供需要直接返回 HTTP body 文本的接口使用。
message RawTextResp {
  string RawText = 1;
}

message Empty {}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
  EVENT_GAME_PLAYER_POD_CHANGE = 1; //游戏玩家实例变更事件
  EVENT_CONFIG_REFRESH = 2; //配置刷新事件
  EVENT_SETTING_REFRESH = 3; //设置刷新事件
  EVENT_EXCEL_REFRESH = 4; //Excel配置刷新事件
  EVENT_JWT_REFRESH = 5; //Jwt密钥刷新事件
}

//游戏玩家实例变更事件
message PodChangeEvt {
  int64 GameServerId = 1 [jstype = JS_STRING];
  int64 PlayerId = 2 [jstype = JS_STRING];
}

//配置刷新事件
message ConfigRefreshEvt {
  int64 Timestamp = 1 [jstype = JS_STRING];
  string TargetService = 2; //目标服务
  string ConfigKey = 3; //配置键
  string ConfigJson = 4; //配置内容JSON
  int32 Version = 5; //配置版本
  bool Enabled = 6; //是否启用
  string Description = 7; //配置描述
}

//设置刷新事件
message SettingRefreshEvt {
  int64 Timestamp = 1 [jstype = JS_STRING]; //时间戳
}

//Excel配置刷新事件
message ExcelRefreshEvt {
  int64 Timestamp = 1 [jstype = JS_STRING]; //时间戳
}

//Jwt密钥刷新事件
message JwtRefreshEvt {
  int64 Timestamp = 1 [jstype = JS_STRING]; //时间戳
}

/** **************** enum **************** **/

enum HttpCode{
  ZERO = 0; //默认
  OK                    = 200; //成功
	BAD_REQUEST           = 400; //请求错误
  AUTH_ERROR            = 401; //认证错误
	TOO_MANY_REQUEST      = 429; //请求太多
  SINGATURE_ERROR       = 493; //签名错误
	HEADER_INVALID        = 494; //header头不合法
	NO_PERMIT_OPERATE     = 495; //无操作权限
	MULTI_CLICK_REPLAY    = 496; //重复点击防重放
	USER_REMOTE_LOGIN     = 497; //用户异地登录
	ACCESS_TOKEN_EXPIRE   = 498; //访问token过期
	REFRESH_TOKEN_EXPIRE  = 499; //刷新token过期
	INTERNAL_SERVER_ERROR = 500; //内部服务错误
	METHOD_INVALID        = 501; //方法不合法
	BAD_GATEWAY           = 502; //网关错误，下游服务器不存在
	SERVICE_UNAVALIABLE   = 503; //服务无法处理
}

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
}

//模块
enum ModuleType{
  MODULE_TEMPLATE = 0;
  MODULE_BASE = 1;
  MODULE_PLAYER = 11;
  MODULE_PUSH = 12;
  MODULE_EXTENT = 13;
  MODULE_BACKPACK = 14;
  MODULE_MATCH = 15;
  MODULE_CHARACTER = 16;
  MODULE_FINANCE = 17;
  MODULE_EMAIL = 18;
  MODULE_CHAT = 19;
  MODULE_TROOP = 20;
  MODULE_DUNGEON = 21;
  MODULE_MANAGER = 22;
  MODULE_PET = 23;
  MODULE_ACTIVITY = 24;
  MODULE_OFFICIAL = 25;
  MODULE_SMS = 26;
  MODULE_TRACKING = 27;
  MODULE_IDENTITY = 28;
  MODULE_PAY = 29;
}

//渠道
enum ChannelType{
  CT_DEFAULT = 0; //默认
  CT_STEAM = 1; //steam平台
}
