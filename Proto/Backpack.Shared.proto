syntax = "proto3";

package Backpack;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Backpack";
option csharp_namespace = "Shared.Proto.Backpack";

/** **************** message **************** **/

message Empty {}

//仓库数据
message StorageData {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 GoodsId = 2; //物品id
  GoodsSite Site = 3; //位置
  int32 GoodsAmount = 4; //物品数量
  int32 Durability = 5; //耐久度
}

//背包容量数据
message BackpackCapData {
  int32 CurCap = 1; //当前背包容量
  int32 ExtendNum = 2; //扩容次数
  int32 ExtendNumLimit = 3; //扩容次数上限
  int32 ExtendCap = 4; //单次扩容容量
  ExtendCost Cost = 5; //扩容消耗
}
//扩容消耗
message ExtendCost {
  int32 CurrencyId = 1; //货币id
  int32 Amount = 2; //数量
}

//装备制造数据
message EquipBuild {
  int64 BuildId = 1 [jstype = JS_STRING]; //制造唯一id
  int32 EquipmentId = 2; //装备id
  int32 TimeLeft = 3; //剩余时间-秒
  int32 EstimatedTime = 4; //预估时间-秒
}

//装备维修数据
message EquipRepair {
  int64 RepairId = 1 [jstype = JS_STRING]; //维修唯一id
  int32 EquipmentId = 2; //装备id
  int32 TimeLeft = 3; //剩余时间-秒
  int32 EstimatedTime = 4; //预估时间-秒
}

//商城商品数据结构体
message ShoppingData {
  int32 ShoppingId = 1; //商品id
  int32 ItemType = 2; //商品种类
  int32 Category = 3; //商品子分类
  int32 Sort = 4; //排序
  int32 Cycle = 5; //商品刷新周期
  int32 Limit = 6; //商品限购数量
  repeated PriceInfo Price = 7; //价格信息
  ShoppingItemInfo Item = 8; //商品物品
}
//价格信息
message PriceInfo{
  int32 CurrencyId = 1; //货币id
  int32 Discount = 2; //折扣
  int32 OriginPrice = 3; //原价
}
//商城物品信息
message ShoppingItemInfo{
  int32 ItemId = 1; //物品id
  int32 Amount = 2; //数量
  int32 ValidTimeTime = 3; //有效时间
}

//失败玩家数据
message FailurePlayerData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  RespCode Result = 2; //结果
}

//载具数据结构体
message CarData {
  int32 CarId = 1; //载具id
  int32 Sort = 2; //排序
  repeated PriceInfo Price = 3; //价格信息
}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
  EVENT_STORAGE_GOODS_CHANGE = 1; //仓库物品变动事件
  EVENT_SKILL_GAIN = 2; //获得技能事件
  EVENT_STORAGE_GOODS_DROP = 3; //仓库掉落物品事件
  EVENT_EQUIP_BUILD_FINISH = 4; //装备制造完成事件
  EVENT_EQUIP_REPAIR_FINISH = 5; //装备维修完成事件
  EVENT_UNLOCK_EQUIP_BUILD = 6; //解锁装备制造事件
}

//仓库变动消息
message EventStorageGoodsChange {
  repeated StorageChangeData List = 1; //仓库变动数据
}
//仓库变动数据
message StorageChangeData {
  ChangeType ChangeType = 1; //变动原因
  int64 StorageId = 2 [jstype = JS_STRING]; //仓库id
  int32 GoodsId = 3; //物品id
  GoodsSite Site = 4; //位置
  int32 Durability = 5; //耐久度
  int32 OriginalAmount = 6; //变动前数量
  int32 ChangedAmount = 7; //变动后数量
  int32 ChangedPosId = 8; //变动后位置id
}
//获得技能事件
message SkillAcquireEvt {
  int32 SkillId = 1; //技能id
}
//解锁装备制造事件
message UnlockEquipBuildEvt {
  int32 EquipmentId = 1; //装备id
}
//仓库掉落物品事件
message StorageGoodsDropEvt {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服id
  int64 PlayerId = 2 [jstype = JS_STRING]; //玩家id
  repeated DropGoodsData List = 3; //掉落仓库列表
}
//掉落物品数据
message DropGoodsData {
  int32 GoodsId = 1; //物品id
  int32 GoodsAmount = 2; //物品数量
  int32 Durability = 3; //耐久度
}
//装备制造完成事件
message EquipBuildFinishEvt {
  int64 BuildId = 1 [jstype = JS_STRING]; //制造id
  int32 EquipmentId = 2; //装备id
}
//装备维修完成事件
message EquipRepairFinishEvt {
  int64 RepairId = 1 [jstype = JS_STRING]; //维修id
  int32 EquipmentId = 2; //装备id
}

/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  //...
  GOODS_NOT_EXIST = 10; //物品不存在
  GOODS_NOT_USE = 11; //物品不可以使用
  GOODS_NOT_DISCARD = 12; //物品不可以丢弃
  GOODS_NOT_EQUIP = 13; //物品不可以装备
  GOODS_NOT_PICKUP = 14; //物品不可以拾取
  GOODS_AMOUNT_NOT_FULL = 15; //物品数量不足
  CAP_IS_FULL = 16; //格子已满
  BACKPACK_IS_FULL = 17; //背包已满
  GOODS_CHANGE_TYPE_ERROR = 18; //物品变动类型错误
  GOODS_AMOUNT_ERROR = 19; //物品数量错误
  GOODS_SITE_NOT_OPERATE = 20; //物品位置不可操作
  CAP_CONFIG_EMPTY = 22; //上限配置为空
  GOODS_CONFIG_ERROR = 23; //物品配置错误
  SHOP_ITEM_EMPTY = 24; //商城物品为空
  SHOP_ITEM_OFF_SALE = 25; //商城物品已下架
  SHOP_ITEM_PRICE_EMPTY = 26; //商城物品价格信息为空
  SHOP_PURCHASE_CURRENCY_NOT_FULL = 27; //商城购买货币不足
  STORAGE_GOODS_NOT_EXIST = 28; //仓库物品不存在
  STORAGE_GOODS_NOT_ENOUGH = 29; //仓库物品数量不足
  GOODS_QUANTITY_FULL = 30; //物品单格数量已满
  GOODS_NOT_STORAGE = 31; //物品不可以存入仓库
  GOODS_BAR_CONFIG_ERROR = 32; //物品栏配置错误
  MERGE_GOODS_NOT_SAME = 33; //合并物品不一致
  EQUIPMENT_NOT_EXIST = 34; //装备不存在
  SKILL_NOT_EXIST = 35; //技能不存在
  PLAYER_SKILL_ALREADY_EXIST = 36; //玩家技能已存在
  BACKPACK_EXTEND_OVER_LIMIT = 37; //背包扩容次数已达上限
  BACKPACK_EXTEND_CURRENCY_NOT_FULL = 38; //背包扩容货币不足
  BACKPACK_EXTEND_CONFIG_ERROR = 39; //背包扩容配置错误
  GOODS_NOT_BUILD_EQUIP = 40; //物品不可制造装备
  BACKPACK_NOT_EXIST_DIAGRAM = 41; //背包不存在设计图
  EQUIPMENT_CONFIG_ERROR = 42; //装备配置错误
  EQUIP_BUILD_NOT_EXIST = 43; //装备制造不存在
  EQUIP_BUILD_ALREADY_FINISH = 44; //装备制造已完成
  EQUIP_BUILD_NOT_FINISH = 45; //装备制造未完成
  EQUIP_BUILD_ALREADY_PICK = 46; //装备制造已取出
  EQUIP_NOT_UPGRADE = 47; //装备不可升级
  EQUIP_REPAIR_NOT_EXIST = 48; //装备制造不存在
  EQUIP_REPAIR_ALREADY_FINISH = 49; //装备维修已完成
  EQUIP_REPAIR_NOT_FINISH = 50; //装备维修未完成
  EQUIP_REPAIR_ALREADY_PICK = 51; //装备维修已取出
  EQUIP_NO_NEED_REPAIR = 52; //装备耐久度满无需维修
  GOODS_NOT_SELL = 53; //物品不可以售卖
  GOODS_SELL_CONFIG_ERROR = 54; //物品售卖配置错误
  EQUIP_BUILD_LOCKED = 55; //装备制造未解锁
  EQUIP_BUILD_ALREADY_LOCK = 56; //装备制造已解锁
  PLAYER_SKILL_NOT_EXIST = 57; //玩家技能不存在

  CAR_NOT_EXIST = 70; //载具不存在
  CAR_PLAYER_NOT_OWNED = 71; //载具玩家未拥有
  CAR_PLAYER_ALREADY_OWNED = 72; //载具玩家已拥有
  CAR_PRICE_CONFIG_ERROR = 73; //载具价格配置错误

  EQUIPMENT_CLOTH_NOT_EXIST = 80; //武器皮肤不存在
  EQUIPMENT_CLOTH_PLAYER_NOT_OWNED = 81; //武器皮肤玩家未拥有
  EQUIPMENT_CLOTH_PLAYER_ALREADY_OWNED = 82; //武器皮肤玩家已拥有
  EQUIPMENT_CLOTH_PRICE_CONFIG_ERROR = 83; //武器皮肤价格配置错误
  EQUIPMENT_CLOTH_CONFIG_ERROR = 84; //武器皮肤配置错误
  EQUIPMENT_CLOTH_NOT_ADAPT_EQUIPMENT = 85; //武器皮肤不适配该装备
}

//物品变动类型
enum ChangeType {
  GOODS_CHANGE_UNKNOWN = 0; //未知
  INIT_GAIN = 1; //初始获得
  PICKUP_GAIN = 2; //普通拾取
  EMAIL_GAIN = 3; //邮件领取
  EQUIP = 4; //装备
  TROOP_BOX = 5; //团队箱
  TERRITORY_BOX = 6; //领地箱
  SHOPPING_PURCHASE = 7; //商店购买
  SHOPPING_SELL = 8; //出售
  SPLIT = 9; //拆分
  MERGE = 10; //合并
  DISCARD = 11; //丢弃
  SELL_COST = 12; //出售
  USE_COST = 13; //使用
  DEATH_DROP = 14; //死亡掉落
  STORAGE_ARRANGE = 15; //仓库整理
  BUILD_EQUIP_COST = 16; //制造装备消耗
  SPEED_EQUIP_BUILD = 17; //加速装备制造
  BUILD_GAIN = 18; //制造获得
  EQUIP_UPGRADE = 19; //装备升级
  REPAIR_EQUIP_COST = 20; //维修装备消耗
  SPEED_EQUIP_REPAIR  = 21; //加速装备维修
  REPAIR_GAIN = 22; //维修获得
  BUILDING_COST = 23; //建造消耗
  MANAGER_GIVE = 24; //后台赠送
  SPECIAL_PICKUP_GAIN = 25; //特殊拾取
  BUILDING_DEDUCT = 26; //建造补偿
  BUILDING_RECYCLE = 27; //建造回收
  PET_RAISING_COST = 28; //宠物培养材料消耗
  PURCHASE_TROOP_TERRITORY = 29; //购买团队领地消耗
  PET_CAPTURE_COST = 30; //捕获宠物时扣除捕获道具
  PET_NORMAL_RAISING_COST = 31; //宠物普通培育消耗
  PET_PROMOTION_RAISING_COST = 32; //宠物突破培育消耗
  PET_REVIVE_RAISING_COST = 33; //宠物死亡复活消耗
  DUNGEON_BEAT_AWARD = 34; //副本通关奖励
  BUILDING_REPAIR_COST = 35; //建造修复消耗
  CHAT_HORN_COST = 36; //喇叭消息消耗
}

//物品位置
enum GoodsSite {
  GS_STORAGE = 0; //仓库
  GS_BACKPACK = 1; //背包
  GS_EQUIP = 2; //装备
}

//存储满时策略
enum StorageFullStrategy {
  SFS_FULL_NOT_OPERATE = 0; //满时不操作
  SFS_OPERATE_FULL_TO_EMAIL = 1; //满时操作，多的放入邮件
  SFS_OPERATE_FULL_TO_DROP = 2; //满时操作，多的通知掉落
}
