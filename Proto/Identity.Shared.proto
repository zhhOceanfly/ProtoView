syntax = "proto3";

package Identity;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Identity";
option csharp_namespace = "Shared.Proto.Identity";

// 实名认证服务响应码。
enum RespCode {
  FAILURE = 0; //失败
  SUCCESS = 1; //实名认证通过
  INVALID_PARAM = 2; //参数错误
  PROVIDER_NOT_SUPPORTED = 10; //认证提供方不支持
  PROVIDER_CONFIG_NOT_FOUND = 11; //认证提供方配置不存在
  PROVIDER_REQUEST_FAILURE = 12; //认证提供方请求失败
  IDENTITY_NOT_VERIFIED = 13; //姓名与身份证号未通过认证
}
