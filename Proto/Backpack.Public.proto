/** **************** message **************** **/

//保存背包设置物品数据
message SaveBackpackSettingItem {
  int32 GoodsId = 1; //物品id
  int32 Amount = 2; //数量
}
//保存背包设置请求体
message SaveBackpackSettingReq {
  repeated SaveBackpackSettingItem List = 1; //新注册赠送配置
}
//保存背包设置响应体
message SaveBackpackSettingResp {
  RespCode Result = 1; //结果
}
//获取背包设置响应体
message BackpackSettingResp {
  RespCode Result = 1; //结果
  repeated SaveBackpackSettingItem List = 2; //新注册赠送配置
}

//仓库列表请求体
message PlayerStorageListReq {
  repeated GoodsSite Sites = 1; //位置列表
  int32 GoodsCategory = 2; //物品分类
  int32 GoodsId = 3; //物品id
}
//仓库列表响应体
message PlayerStorageListResp {
  RespCode Result = 1; //结果
  repeated StorageData List = 2; //仓库列表
  BackpackCapData BackpackCap = 3; //背包扩容信息
}

//拆分仓库物品请求体
message PlayerStorageSplitGoodsReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 GoodsAmount = 2; //拆分物品数量
}
//拆分仓库物品响应体
message PlayerStorageSplitGoodsResp {
  RespCode Result = 1; //结果
  GoodsSite Site = 2; //位置
  repeated StorageChangeData ChangeList = 3; //仓库变动列表
}

//合并仓库物品请求体
message PlayerStorageMergeGoodsReq {
  GoodsSite Site = 1; //位置
}
//合并仓库物品响应体
message PlayerStorageMergeGoodsResp {
  RespCode Result = 1; //结果
  repeated StorageChangeData ChangeList = 2; //仓库变动列表
}

//仓库物品批量丢弃请求体
message PlayerStorageMultiDiscardGoodsReq {
  repeated int64 StorageIds = 1 [jstype = JS_STRING]; //丢弃仓库id列表
}
//仓库物品批量丢弃响应体
message PlayerStorageMultiDiscardGoodsResp {
  RespCode Result = 1; //结果
}

//玩家扩容背包响应体
message PlayerExtendBackpackResp {
  RespCode Result = 1; //结果
  BackpackCapData BackpackCap = 2; //背包扩容信息
}

//玩家售卖仓库物品请求体
message PlayerSellStorageGoodsReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 Amount = 2; //售卖数量
}
//玩家售卖仓库物品响应体
message PlayerSellStorageGoodsResp {
  RespCode Result = 1;
}

//玩家已解锁装备制造列表响应体
message PlayerUnlockEquipBuildListResp {
  RespCode Result = 1; //结果
  repeated int32 EquipmentIds = 2; //已解锁装备制造列表
}

//玩家装备制造列表响应体
message PlayerEquipBuildListResp {
  RespCode Result = 1; //结果
  repeated EquipBuild BuildList = 2; //装备制造列表
}

//玩家制造装备请求体
message PlayerBuildEquipReq {
  int32 EquipmentId = 1; //装备id
}
//玩家制造装备响应体
message PlayerBuildEquipResp {
  RespCode Result = 1; //结果 枚举值
  EquipBuild BuildInfo = 2; //制造信息
}

//玩家加速装备制造请求体
message PlayerSpeedEquipBuildReq {
  int64 BuildId = 1 [jstype = JS_STRING]; //制造id
}
//玩家加速装备制造响应体
message PlayerSpeedEquipBuildResp {
  RespCode Result = 1; //结果 枚举值
  EquipBuild BuildInfo = 2; //制造信息
}

//玩家装备维修列表响应体
message PlayerEquipRepairListResp {
  RespCode Result = 1; //结果
  repeated EquipRepair RepairList = 2; //装备维修列表
}

//玩家维修装备请求体
message PlayerRepairEquipReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
}
//玩家维修装备响应体
message PlayerRepairEquipResp {
  RespCode Result = 1; //结果 枚举值
  EquipRepair RepairInfo = 2; //维修信息
}

//玩家加速装备维修请求体
message PlayerSpeedEquipRepairReq {
  int64 RepairId = 1 [jstype = JS_STRING]; //维修id
}
//玩家加速装备维修响应体
message PlayerSpeedEquipRepairResp {
  RespCode Result = 1; //结果 枚举值
  EquipRepair RepairInfo = 2; //维修信息
}

//玩家技能列表响应体
message PlayerSkillListResp {
  RespCode Result = 1; //结果
  repeated int32 SkillIds = 2; //技能id列表
}

//商城列表响应体
message ShoppingListResp {
  RespCode Result = 1; //结果
  repeated ShoppingData List = 2; //商品列表
}

//商城购买请求体
message ShoppingPurchaseReq {
  int32 CurrencyId = 1; //购买货币id
  int32 ShoppingId = 2; //商品id
  int32 Amount = 3; //购买数量
}
//商城购买响应体
message ShoppingPurchaseResp {
  RespCode Result = 1; //结果
  ShoppingItemInfo Item = 2; //购买商品物品
}

//载具商城列表响应体
message CarListResp {
  RespCode Result = 1; //结果
  repeated CarData List = 2; //载具列表
}
//玩家载具列表响应体
message PlayerCarListResp {
  RespCode Result = 1; //结果
  repeated int32 CarIds = 2; //载具id列表
}
//购买载具请求体
message CarPurchaseReq {
  int32 CurrencyId = 1; //购买货币id
  int32 CarId = 2; //载具id
}
//购买载具响应体
message CarPurchaseResp {
  RespCode Result = 1; //结果
}
//武器皮肤数据
message EquipmentClothData {
  int32 ClothId = 1; //皮肤id
  int32 Sort = 2; //排序
  repeated PriceInfo Price = 3; //价格信息
}
//武器皮肤商城列表响应体
message EquipmentClothListResp {
  RespCode Result = 1; //结果
  repeated EquipmentClothData List = 2; //武器皮肤列表
}
//玩家武器皮肤列表响应体
message PlayerEquipmentClothListResp {
  RespCode Result = 1; //结果
  repeated PlayerEquipmentClothData List = 2; //已拥有武器皮肤列表
}
//玩家武器皮肤数据
message PlayerEquipmentClothData {
  int32 ClothId = 1; //皮肤id
  repeated int32 EquipIds = 2; //已绑定的武器id列表
}
//购买武器皮肤请求体
message PlayerPurchaseEquipmentClothReq {
  int32 CurrencyId = 1; //购买货币id
  int32 ClothId = 2; //皮肤id
}
//购买武器皮肤响应体
message PlayerPurchaseEquipmentClothResp {
  RespCode Result = 1; //结果
}
