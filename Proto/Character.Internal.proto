syntax = "proto3";

package Character;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Character";
option csharp_namespace = "Shared.Proto.Character";

import "MetaInf.proto";
import "Character.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //请求持久化玩家角色数据
  rpc ReqInternalPersistCharacterData(PersistCharacterDataReq) returns (PersistCharacterDataResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //请求选取角色存档校验
  rpc ReqInternalUseCharacterVerify(InternalUseCharacterVerifyReq) returns (InternalUseCharacterVerifyResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //请求删除玩家角色数据
  // rpc ReqInternalDeleteCharacterData(DeleteCharacterDataReq) returns (DeleteCharacterDataResp){
  //   option (MetaInf.Meta) = {
  //     SessionConfig: {
  //       UserMod: {}
  //     },
  //   };
  // };

  //请求玩家使用的皮肤列表
  rpc ReqInternalPlayerUseClothList(Empty) returns (PlayerUseClothListResp){
    option (MetaInf.Meta) = {
      Closed: true,
      Mem: Read,
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //请求玩家使用皮肤
  rpc ReqInternalPlayerUseCloth(PlayerUseClothReq) returns (PlayerUseClothResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //请求玩家卸下皮肤
  rpc ReqInternalPlayerUnuseCloth(PlayerUnuseClothReq) returns (PlayerUnuseClothResp){
    option (MetaInf.Meta) = {
      Closed: true,
      SessionConfig: {
        UserMod: {}
      },
    };
  };
}

/** **************** message **************** **/

//内部选取角色校验请求体
message InternalUseCharacterVerifyReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  int64 CharacterAid = 2 [jstype = JS_STRING]; //角色存档id
}
//内部选取角色校验响应体
message InternalUseCharacterVerifyResp {
  RespCode Result = 1; //结果
  UseCharacterData CharacterInfo = 2; //角色信息
  repeated int32 UseClothIds = 3; //使用的皮肤id列表
}

//持久化角色数据请求体
message PersistCharacterDataReq {
  int64 CharacterAid = 1 [jstype = JS_STRING]; //角色存档id
  int32 CharacterId = 2; //角色id
  bytes Data = 3; //角色数据
  string Remark = 4; //备注
  int32 MapId = 5; //地图id
  int32 TerritoryId = 6; //领地id
  int64 PlayerId = 7 [jstype = JS_STRING]; //玩家id
  int32 CurExp = 8; //当前经验值
  string Position = 9; //位置
  string Rotation = 10; //旋转
  bool IsManualPersist = 11; //是否主动持久化
  CharacterState State = 12; //角色状态
  repeated EquipmentDurabilityData EquipmentDurabilityList = 13; //装备耐久度列表
}
//持久化角色数据响应体
message PersistCharacterDataResp {
  RespCode Result = 1; //结果
}
//装备耐久度数据
message EquipmentDurabilityData {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 Durability = 2; //耐久度
}

//删除角色数据请求体
message DeleteCharacterDataReq {
  int64 CharacterAid = 1 [jstype = JS_STRING]; //角色存档id
  CharacterReason CharacterReason = 2; //角色删除原因
}
//删除角色数据响应体
message DeleteCharacterDataResp {
  RespCode Result = 1; //结果 枚举值RespCode
}

//玩家使用的皮肤列表响应体
message PlayerUseClothListResp {
  RespCode Result = 1; //结果
  repeated int32 UseClothIds = 2; //使用的皮肤id列表
}

//玩家使用皮肤请求体
message PlayerUseClothReq {
  int32 CharacterId = 1; //角色id
  int32 ClothId = 2; //皮肤id
}
//玩家使用皮肤响应体
message PlayerUseClothResp {
  RespCode Result = 1; //结果
  repeated int32 UseClothIds = 2; //使用的皮肤id列表
}

//玩家卸下皮肤请求体
message PlayerUnuseClothReq {
  int32 ClothId = 1; //皮肤id
}
//玩家卸下皮肤响应体
message PlayerUnuseClothResp {
  RespCode Result = 1; //结果
  repeated int32 UseClothIds = 2; //使用的皮肤id列表
}
