/** **************** message **************** **/

//查询服务器列表请求体
message ServerListReq {
  string ServerName = 1; //服务器名称
  int32 ServerType = 2; //服务器类型
}
//查询服务器列表响应体
message ServerListResp {
  RespCode Result = 1; //结果
  repeated ServerData ServerList = 2; //服务器列表
}
//服务器数据
message ServerData {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
  string ServerName = 2; //服务器名称
  int32 MaxPeople = 3; //最大人数
  int32 CurPeople = 4; //当前人数
  int32 ServerType = 5; //服务器类型
}

//加入服务器请求体
message JoinServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
}
//加入服务器响应体
message JoinServerResp {
  RespCode Result = 1; //结果
}

//加入服务器场景请求体
message JoinSceneReq {
  int32 MapId = 1; //地图id
  int64 CharacterAid = 2 [jstype = JS_STRING]; //角色存档id
}
//加入服务器场景响应体
message JoinSceneResp {
  RespCode Result = 1; //结果
  int64 ServerId = 2 [jstype = JS_STRING]; //服务器id
  int64 GameServerId = 3 [jstype = JS_STRING]; //游戏服务器id
  string JoinToken = 4; //预加入token
  string PhysicalServerAddr = 5; //物理服务器地址
}

//设置服务器玩家名称请求体
message SetServerPlayerNameReq {
  string PlayerName = 1; //玩家名称
}
//设置服务器玩家名称响应体
message SetServerPlayerNameResp {
  RespCode Result = 1; //结果
}

//玩家刷新token请求体
message RefreshTokenReq{
  string RefreshToken = 1; //刷新token
  string DeviceId = 2; //设备id
  string MacAddr = 3; //mac地址
}
//玩家刷新token响应体
message RefreshTokenResp{
  RespCode Result = 1; //结果
  TokenData TokenInfo = 2; //token数据
}

//服务器玩家列表请求体
message ServerPlayerListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string Condition = 3; //搜索条件
  OnlineState OnlineState = 4; //是否在线
}
//服务器玩家列表响应体
message ServerPlayerListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated PlayerData PlayerList = 5; //在线玩家列表
}

//后台服务器玩家列表请求体
message ManageServerPlayerListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string Condition = 3; //搜索条件
  OnlineState OnlineState = 4; //是否在线
  SearchSort Sort = 5; //排序
  SortDirection Direction = 6; //排序方向
}
//后台服务器玩家列表响应体
message ManageServerPlayerListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated ManagePlayerData PlayerList = 5; //在线玩家列表
}
//查询后台服务器列表请求体
message ManageServerListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string ServerName = 3; //服务器名称
}
//查询后台服务器列表响应体
message ManageServerListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated ManageServerData ServerList = 5; //服务器列表
}
//后台服务器数据
message ManageServerData {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
  string ServerName = 2; //服务器名称
  int32 MaxPeople = 3; //最大人数
  int32 CurPeople = 4; //当前人数
  int32 ServerType = 5; //服务器类型
  string CreatorName = 6; //创建人名称
  ManageServerState State = 7; //服务器状态
  int64 PreServerId = 8; //预分配服务器id
  int32 CreateTime = 9; //创建时间
}

//创建游戏服务器请求体
message CreateServerReq {
  string ServerName = 1; //服务器名称
  int32 MaxPeople = 2; //最大人数
  int32 ServerType = 3; //服务器类型
  int64 PreServerId = 4; //预分配服务器id
}
//创建游戏服务器响应体
message CreateServerResp {
  RespCode Result = 1; //结果
}

//更新游戏服务器请求体
message UpdateServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //服务器id
  string ServerName = 2; //服务器名称
  int32 MaxPeople = 3; //最大人数
  int64 PreServerId = 4; //预分配服务器id
}
//更新游戏服务器响应体
message UpdateServerResp {
  RespCode Result = 1; //结果
}

//后台删除游戏服务器请求体
message ManageDeleteServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器ID
}
//后台删除游戏服务器响应体
message ManageDeleteServerResp {
  RespCode Result = 1; //结果
}

//开启游戏服务器请求体
message StartServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //服务器id
}
//开启游戏服务器响应体
message StartServerResp {
  RespCode Result = 1; //结果
}

//停止游戏服务器请求体
message StopServerReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //服务器id
}
//停止游戏服务器响应体
message StopServerResp {
  RespCode Result = 1; //结果
}

//分线实体信息
message ServerLineInfo {
  int64 SceneId = 1 [jstype = JS_STRING]; //分线场景ID
  int64 GameServerId = 2 [jstype = JS_STRING]; //所属游戏服务器ID
  string SceneName = 3; //分线名称
  int32 MapId = 4; //地图id
  int32 MaxPeople = 5; //玩家容量上限
  int32 CurPeople = 6; //当前在线人数
  ManageServerState State = 7; //分线状态
}

//后台分线实体信息
message ManageServerLineInfo {
  int64 SceneId = 1 [jstype = JS_STRING]; //分线场景ID
  int64 GameServerId = 2 [jstype = JS_STRING]; //所属游戏服务器ID
  string SceneName = 3; //分线名称
  ManageServerState State = 4; //分线状态
  int32 MaxPeople = 5; //玩家容量上限
  int32 CurPeople = 6; //当前在线人数
  int32 CreateTime = 7; //创建时间
  int64 PreServerId = 8 [jstype = JS_STRING]; //预分配物理服务器ID
  int64 PhysicalServerId = 9 [jstype = JS_STRING]; //物理服务器ID
  string CreatorName = 10; //创建人名称
  int32 MapId = 11; //地图id
}

//查询分线实体列表请求体
message GetServerLineListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string SceneName = 3; //分线名称
}
//查询分线实体列表响应体
message GetServerLineListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  bool CanManualChangeLine = 5; //是否可以手动切换分线
  repeated ServerLineInfo ServerLineList = 6; //分线列表
  int64 CrystalSceneId = 7 [jstype = JS_STRING];  //个人领地所在分线
}

//后台查询分线实体列表请求体
message ManageGetServerLineListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string SceneName = 3; //分线名称
}
//后台查询分线实体列表响应体
message ManageGetServerLineListResp {
  RespCode Result = 1; //结果
  int32 PageNumber = 2; //页码
  int32 PageSize = 3; //每页数量
  int32 Total = 4; //总数
  repeated ManageServerLineInfo ServerLineList = 5; //分线列表
}

//后台创建服务器分线请求体
message ManageCreateServerLineReq {
  int32 MaxPeople = 1; //玩家容量上限
  string SceneName = 2; //分线名称，为空时自动生成
  int64 PreServerId = 3 [jstype = JS_STRING]; //预分配物理服务器ID
  int32 MapId = 4; //地图id
}
//后台创建服务器分线响应体
message ManageCreateServerLineResp {
  RespCode Result = 1; //结果
}

//后台保存并刷新服务器分线请求体
message ManageRefreshServerLineReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //分线场景ID
  string SceneName = 2; //分线名称
  int32 MaxPeople = 3; //玩家容量上限
  int64 PreServerId = 4 [jstype = JS_STRING]; //预分配物理服务器ID
  int32 MapId = 5; //地图id
}
//后台保存并刷新服务器分线响应体
message ManageRefreshServerLineResp {
  RespCode Result = 1; //结果
}

//后台删除服务器分线请求体
message ManageDeleteServerLineReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //分线场景ID
}
//后台删除服务器分线响应体
