  int32 ToCloseTime = 2; //预约关闭时间
}
//后台定时关闭服务器分线响应体
message ManageToCloseServerLineResp {
  RespCode Result = 1; //结果
}

//后台关闭服务器分线请求体
message ManageCloseServerLineReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //分线场景ID
}
//后台关闭服务器分线响应体
message ManageCloseServerLineResp {
  RespCode Result = 1; //结果
}

//后台查询服务器设置
message ManageGameServerSettingResp {
  RespCode Result = 1; //结果
  GameServerSetting Setting = 2; //游戏服务器设置
}
//后台修改游戏服务器设置请求体
message UpdateGameServerSettingReq {
  GameServerSetting Setting = 1; //游戏服务器设置
}
//后台修改游戏服务器设置响应体
message UpdateGameServerSettingResp {
  RespCode Result = 1; //结果
}
//游戏服务器设置
message GameServerSetting {
  int32 LineLimit = 1; //分线数量上限
  int32 LineChangeCd = 2; //玩家切换分线冷却时间
  int32 TeamDungeonLimit = 3; //团队副本数量上限
  map<int32, int32> MapTypeReserveNum = 4; //地图类型预留数量
}
