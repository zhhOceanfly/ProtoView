syntax = "proto3";

package Push;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Push";
option csharp_namespace = "Shared.Proto.Push";

import "MetaInf.proto";
import "Push.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  // 玩家事件流
  rpc ReqDuplexPlayerEvent(stream ClientEvent) returns (stream ServerEvent){
    option (MetaInf.Meta) = {
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        TokenType: ["preset_login_token", "access_token"]
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      LimitConfig: {
        UserLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //玩家刷新token
  // rpc ReqBaseRefreshToken(RefreshTokenReq) returns (RefreshTokenResp){
  //   option (MetaInf.Meta) = {
  //     Closed: true,
  //     Timeout: 15,
  //     Replay: {
  //       CacheTime: 10
  //     },
  //     LimitConfig: {
  //       UserMethodLimit: {
  //         TimeWindow: 1,
  //         CallCount: 2,
  //         BanTime: 1
  //       }
  //     }
  //   };
  // };
}

/** **************** message **************** **/

//玩家刷新token请求体
message RefreshTokenReq{
  string RefreshToken = 1; //刷新token
  string DeviceId = 2; //设备id
  string MacAddr = 3; //mac地址
}
//玩家刷新token响应体
message RefreshTokenResp{
  RespCode Result = 1; //结果
  TokenData TokenInfo = 2; //token数据
}
