syntax = "proto3";

package Finance;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Finance";
option csharp_namespace = "Shared.Proto.Finance";

/** **************** message **************** **/

message Empty {}

//充值档位
message RechargeProduct {
  int32 ProductId = 1; //档位id
  int32 GoodsId = 2; //发货货币id
  int32 GoodsNum = 3; //发货数量
  int32 Amount = 4; //支付金额，单位分
  string Desc = 5; //档位描述
}

//充值订单信息
message RechargeOrderInfo {
  string OrderNo = 1; //游戏侧订单号，对应中信outTradeNo
  int32 ProductId = 2; //充值档位id
  int32 GoodsId = 3; //发货物品id
  int32 GoodsNum = 4; //发货物品数量
  int32 Amount = 5; //订单金额，单位分
  RechargeOrderState State = 6; //订单状态
  string CodeUrl = 7; //聚合二维码内容
  string CodeImgUrl = 8; //二维码图片地址
  int64 GameServerId = 9 [jstype = JS_STRING]; //游戏服id（后台列表使用）
  int64 PlayerId = 10 [jstype = JS_STRING]; //玩家id（后台列表使用）
  int32 RefundAmount = 11; //退款金额，单位分
  string RefundNo = 12; //退款单号
  int32 PayTime = 13; //支付成功时间
  int32 DeliverTime = 14; //发货完成时间
  int32 RefundTime = 15; //退款完成时间
  int32 CreateTime = 16; //创建时间
}

//充值订单状态
enum RechargeOrderState {
  RECHARGE_ORDER_UNKNOWN = 0; //未知
  RECHARGE_ORDER_WAIT_PAY = 1; //待支付
  RECHARGE_ORDER_PAID = 2; //已支付
  RECHARGE_ORDER_DELIVERED = 3; //已发货
  RECHARGE_ORDER_CLOSED = 4; //已关闭
  RECHARGE_ORDER_REFUNDING = 5; //退款中
  RECHARGE_ORDER_REFUNDED = 6; //已退款
  RECHARGE_ORDER_REFUND_FAIL = 7; //退款失败
}

//货币数据结构体
message CurrencyData {
  int32 OneAmount = 1;
  int32 TwoAmount = 2;
  int32 ThreeAmount = 3;
}

//货币变动数据
message CurrencyChangeData {
  CurrencyChangeType ChangeType = 1; //变动原因
  int32 CurrencyId = 2; //货币id
  int32 ChangeAmount = 3; //变动数量
}

//失败玩家数据
message FailurePlayerData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  RespCode Result = 2; //结果
}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
  EVENT_CURRENCY_CHANGE = 1; //货币变动事件
}

//货币变动消息
message EventCurrencyChangeMsg {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  CurrencyData Info = 2; //货币信息
}

/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  //...
  PLAYER_CURRENCY_EMPTY = 10; //玩家货币为空
  CURRENCY_NOT_EXIST = 11; //货币不存在
  CURRENCY_NOT_FULL = 12; //货币不足
  CHANGE_AMOUNT_ERROR = 13; //变更数量错误
  CHANGE_PARAM_EMPTY = 14; //变更参数为空
  INIT_CURRENCY_CONFIG_EMPTY = 15; //初始化货币配置为空
  PLAYER_CURRENCY_ALREADY_INIT= 16; //玩家货币已初始化
  CURRENCY_GENERATE_UUID_ERROR = 17; //货币生成id错误
  RECHARGE_PRODUCT_NOT_EXIST = 18; //充值档位不存在
  RECHARGE_ORDER_NOT_EXIST = 19; //充值订单不存在
  RECHARGE_ORDER_STATE_ERROR = 20; //充值订单状态错误
  RECHARGE_CREATE_FAILURE = 21; //充值下单失败
  RECHARGE_REFUND_FAILURE = 22; //充值退款失败
  RECHARGE_REFUND_AMOUNT_ERROR = 23; //退款金额错误
}

//货币变动类型
enum CurrencyChangeType {
  CURRENCY_CHANGE_UNKNOWN = 0; //未知

  INIT_GAIN = 1001; //初始获得
  EMAIL_GAIN = 1002; //邮件获得
  GOODS_SELL_GAIN = 1003; //物品售卖获得
  MANAGER_GIVE_GAIN = 1004; //后台赠送获得
  CREATE_TROOP_DEDUCT = 1005; //创建团队补偿
  SHOPPING_PURCHASE_DEDUCT = 1006; //商城购买补偿
  DUNGEON_BEAT_AWARD = 1007; //副本通关奖励
  RECHARGE_GAIN = 1008; //充值获得

  PURCHASE_CHARACTER_COST = 2001; //购买角色
  CREATE_TROOP_COST = 2002; //创建团队消耗
  CHALLENGE_TERRITORY_FB_COST= 2003; //挑战领地副本消耗
  CHALLENGE_TERRITORY_COST = 2004; //挑战领地消耗
  BUILDING_COST = 2005; //建造消耗
  SHOPPING_PURCHASE_COST = 2006; //商城购买消耗
  BACKPACK_EXTEND_COST = 2007; //背包扩容消耗
  CLOTH_PURCHASE_COST = 2008; //皮肤购买消耗
  MAP_TRANSFER_COST = 2009; //地图传送消耗
  PET_EXTEND_COST = 2010; //宠物仓库扩容消耗
  DUNGEON_PAID_AWARD_COST = 2011; //副本付费奖励消耗
}
