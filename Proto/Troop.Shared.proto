//团队角色类型
enum TroopRole {
  MEMBER = 0; //队员
  COCAPTAIN = 1; //副队长
  CAPTAIN = 2; //队长
}

//小队角色类型
enum TeamRole {
  TEAM_MEMBER = 0; //小队队员
  TEAM_CAPTAIN = 1; //小队长
}

//审核操作类型
enum ReviewOperateType {
  REJECT = 0; //拒绝
  AGREE = 1; //同意
}

//团队申请状态
enum TroopApplyState {
  AS_UNKNOWN = 0; //未知
  IS_APPLY = 1; //已申请
  NO_APPLY = 2; //未申请
}

enum OnlineState {
  OS_UNKNOWN = 0; //未知
  ONLINE = 1; //在线
  OFFLINING = 2; //离线中
  OFFLINE = 3; //离线
}

//团队权限标签
enum TroopPermissionLabel {
  PL_MODIFY_NOTICE = 0; //修改公告权限
  PL_MODIFY_TROOP_NAME = 1; //修改团队名权限
  PL_MODIFY_TROOP_LOGO = 2; //修改团队队徽权限
  PL_REVIEW_TROOP_APPLY = 3; //审核团队申请权限
  PL_INVITE_TROOP_PLAYER = 4; //邀请成员权限
  PL_KICKOUT_TROOP_PLAYER = 5; //踢出成员权限
  PL_MOVE_BUILDING = 6; //移动团队建造权限
  PL_REMOVE_BUILDING = 7; //拆除团队建造权限
}

//物品变动类型
enum GoodsChangeType {
  GOODS_CHANGE_UNKNOWN = 0; //未知

  STORAGE_GAIN = 1001; //背包存入

  BUILDING_COST = 2001; //建造消耗
  TAKE_OUT_COST = 2002; //背包取出
}

//副本取消原因
enum DungeonCancelReason {
  DCR_UNKNOWN = 0; //未知
  DCR_MANUAL_CANCEL = 1; //小队长主动取消
  DCR_MANUAL_REFUSE = 2; //小队成员拒绝
  DCR_COUNTDOWN_TIMEOUT = 3; //超时倒计时自动取消
  DCR_PLAYER_FIGHTING = 4; //玩家战斗中
  DCR_PLAYER_NOT_READY = 5; //玩家未就绪
  DCR_TEAM_INFO_CHANGE = 6; //小队信息变更
  DCR_SERVER_ERROR = 7; //服务器错误
  DCR_PLAYER_LEAVE_SCENE = 8; //玩家离开场景
  DCR_PLAYER_OFFLINE = 9; //玩家掉线
  DCR_RETRY_NUM_OVER = 10; //重试次数超出
}

