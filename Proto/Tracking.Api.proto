syntax = "proto3";

package Tracking;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Tracking";
option csharp_namespace = "Shared.Proto.Tracking";

import "MetaInf.proto";
import "Tracking.Shared.proto";
import "google/api/annotations.proto";

/** **************** service **************** **/

// 官网埋点上报服务
//	tips: 该服务仅作为业务http接口的协议契约与元数据来源，不注册grpc服务，
//	     传输走 Client/Api 监听，鉴权/限流/防重放等配置由 MetaInf 统一管理
service ApiService {
  // 监控检查
  rpc ReqBaseHealthCheck(Empty) returns (HealthCheckResp) {
    option (MetaInf.Meta) = {
      Timeout: 5,
      AuthConfig: {
        AuthOption: NO_AUTH
      },
      NotSigna: true,
      NotTracing: true,
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 1
        }
      }
    };
    option (google.api.http) = {
    	get: "/tracking/base/health_check"
    };
  }
  // 官网埋点事件上报
  rpc ReqBaseOfficialReportEvent(OfficialReportEventReq) returns (OfficialReportEventResp) {
    option (MetaInf.Meta) = {
      Timeout: 5,
      AuthConfig: {
        AuthOption: SELECT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_OFFICIAL]
      },
      NotTracing: true,
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 5,
          BanTime: 1
        }
      }
    };
    option (google.api.http) = {
    	post: "/tracking/base/official/report_event"
    	body: "*"
    };
  }

  // 埋点事件上报
  rpc ReqBaseReportEvent(ReportEventReq) returns (ReportEventResp) {
    option (MetaInf.Meta) = {
      Closed: true,
      Timeout: 5,
      AuthConfig: {
        AuthOption: SELECT_AUTH,
        JwtSources: [JS_PLAYER],
        JtiCheck: {
          ClientTtl: 0
        },
        Tags: []
      },
      NotSigna: true,
      NotTracing: true,
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        IpLimit: {
          TimeWindow: 1,
          CallCount: 50,
          BanTime: 1
        }
      }
    };
    option (google.api.http) = {
    	post: "/tracking/base/report_event"
    };
  }
}

/** **************** message **************** **/

// 监控检查响应
message HealthCheckResp {
  RespCode code = 1;   // 业务返回码
  string message = 2;  // 附加信息
}

// 官网埋点事件上报请求
//	tips: 接口 NO_AUTH，不接受客户端 player_id；UV 以 distinct_id 为准
//	      若网关注入登录态，服务端自行写入 player_id 并与 distinct_id 绑定
message OfficialReportEventReq {
  EventType event_type = 1;       // 事件类型，EVENT_PAGE_VIEW 计入 PV
  string distinct_id = 2;         // 匿名访客标识，必填，浏览器持久化
  int64 timestamp = 3 [jstype = JS_STRING];            // 客户端事件时间戳（毫秒），0 表示用服务端时间
  string url = 4;                 // 页面地址，建议保留 UTM query
  string referrer = 5;            // 来源页
  map<string, string> props = 6;  // 自定义属性，如 button_id / utm_* / 活动id
}

// 官网埋点事件上报响应
message OfficialReportEventResp {
  RespCode code = 1;   // 业务返回码
}

// 埋点事件上报请求
message ReportEventReq {
  string event_id = 1;            // 事件唯一id，客户端生成，用于去重
  string event_type = 2;          // 事件类型
  string distinct_id = 3;         // 匿名访客标识
  int64 player_id = 4 [jstype = JS_STRING];            // 玩家id，未登录为0
  int64 game_server_id = 5 [jstype = JS_STRING];       // 游戏服id，未指定为0
  int64 timestamp = 6 [jstype = JS_STRING];            // 客户端事件时间戳（毫秒）
  string platform = 7;            // 来源平台，如 web/ios/android
  string url = 8;                 // 页面地址
  string referrer = 9;            // 来源页
  map<string, string> props = 10; // 自定义属性
}

// 埋点事件上报响应
message ReportEventResp {
  RespCode code = 1;   // 业务返回码
  string message = 2;  // 附加信息
}