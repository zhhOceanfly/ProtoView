syntax = "proto3";

package Identity;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Identity";
option csharp_namespace = "Shared.Proto.Identity";

import "MetaInf.proto";
import "Identity.Shared.proto";

// 内部服务定义。
service InternalService {
  // 校验提交的姓名和身份证号是否匹配。
  rpc ReqVerifyIdentity(VerifyIdentityReq) returns (VerifyIdentityResp) {
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      }
    };
  }
}

// 实名认证请求体。
message VerifyIdentityReq {
  string RealName = 1; //真实姓名
  string RealIdCard = 2; //身份证号
  string ConfigTag = 3; //可选配置标签，例如 nppa:config-a；为空时使用服务端默认配置
}

// 实名认证响应体。
message VerifyIdentityResp {
  RespCode Result = 1; //请求处理结果
  string SelectedConfigTag = 2; //实际使用的配置标签，例如 nppa:config-a
}
