syntax = "proto3";

package Manager;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Manager";

import "MetaInf.proto";
import "Manager.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //内部获取账户缓存列表
  rpc ReqAccountCacheList(AccountCacheListReq) returns (AccountCacheListResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
      CacheConfig: {
        ClientTtl: 30,
        ServerTtl: 0
      }
    };
  };
}

/** **************** message **************** **/

//获取账户缓存列表请求体
message AccountCacheListReq {
  repeated int64 AcctIds = 1 [jstype = JS_STRING]; //账户id列表
  string Name = 2; //账号名称
}
//获取账户缓存列表响应体
message AccountCacheListResp {
  RespCode Result = 1; //结果
  repeated AccountCache AcctList = 2; //账户列表
}
//账户缓存结构体
message AccountCache {
  int64 AcctId = 1 [jstype = JS_STRING]; //账户id
  string Name = 2; //名称
}
