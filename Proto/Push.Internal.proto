syntax = "proto3";

package Push;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Push";
option csharp_namespace = "Shared.Proto.Push";

import "MetaInf.proto";
import "Push.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  // 内部双向事件流
  rpc ReqDuplexInternalEvent(stream ClientEvent) returns (stream ServerEvent){
    option (MetaInf.Meta) = {
    };
  };
  // 内部推送事件接口
  rpc ReqInternalPushEvent(PushEventReq) returns (PushEventResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  // 订阅主题
  rpc ReqInternalSubscribeTopic(SubscribeTopicReq) returns (SubscribeTopicResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  // 取消订阅主题
  rpc ReqInternalUnsubscribeTopic(UnsubscribeTopicReq) returns (UnsubscribeTopicResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };

  //确认加入服务器
  rpc ReqInternalConfirmJoinServer(ConfirmJoinServerReq) returns (ConfirmJoinServerResp){
    option (MetaInf.Meta) = {
      Closed: true,
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //踢掉客户端
  rpc ReqInternalKickoutPlayer(KickoutPlayerReq) returns (KickoutPlayerResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
    };
  };
  //内部校验jti
  rpc ReqInternalCheckJti(CheckJtiReq) returns (CheckJtiResp){
    option (MetaInf.Meta) = {
      Closed: true,
      SessionConfig: {
        UserMod: {}
      },
      CacheConfig: {
        ClientTtl: 10,
        ServerTtl: 0
      }
    };
  };
}
/** **************** message **************** **/

//推送事件消息体
message PushEventReq {
  PushMeta MetaData = 1; //推送元数据
  ServerEventData EventData = 2; //服务器事件数据列表
}
//推送事件响应体
message PushEventResp {
  RespCode Result = 1; //结果
  int32 ReceiverNum = 2; //接收者数量
}
//推送元数据
message PushMeta {
  string Topic = 1; //推送主题
  repeated string BizTags = 2; //推送业务列表
  PushCond Cond = 3; //条件
}
message PushCond {
  int32 GamePlayerCreateTime = 1;
  PushCondExp Exp = 2;
}

//订阅主题请求体
message SubscribeTopicReq {
  string Topic = 1; //主题
  string BizId = 2; //业务id
  string ClientId = 3; //连接id
}
//订阅主题响应体
message SubscribeTopicResp {
  RespCode Result = 1; //结果
}

//取消订阅主题请求体
message UnsubscribeTopicReq {
  string Topic = 1; //主题
  string BizId = 2; //业务id
  string ClientId = 3; //连接id
}
//取消订阅主题响应体
message UnsubscribeTopicResp {
  RespCode Result = 1; //结果
}

//确认加入服务器请求体
message ConfirmJoinServerReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  int64 ServerId = 2 [jstype = JS_STRING]; //服务器id
  int64 GameServerId = 3 [jstype = JS_STRING]; //游戏服务器id
  string TokenJti = 4; //token唯一jti
  int32 GamePlayerCreateTime = 5; //游戏玩家创建时间
  string PhysicalServerAddr = 6; //物理服务器地址
  string GameServerPlayerName = 7; //游戏服务器玩家名称
  bool IsReconnect = 8; //是否重连
}
//确认加入服务器响应体
message ConfirmJoinServerResp {
  RespCode Result = 1; //结果
}

//踢掉玩家请求体
message KickoutPlayerReq {
  string FirstClientId = 1; //首次连接id
  string BizTag = 2; //业务标识
}
//踢掉玩家响应体
message KickoutPlayerResp {
  RespCode Result = 1; //结果
}

//校验jti请求体
message CheckJtiReq {
  string ClientId = 1; //连接id
  string TokenJti = 2; //jti
  int64 PlayerId = 3 [jstype = JS_STRING]; //玩家id
  int64 GameServerId = 4 [jstype = JS_STRING]; //游戏服务器id
}
//校验jti响应体
message CheckJtiResp {
  RespCode Result = 1; //结果
}