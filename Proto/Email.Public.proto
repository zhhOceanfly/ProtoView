syntax = "proto3";

package Email;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Email";
option csharp_namespace = "Shared.Proto.Email";

import "MetaInf.proto";
import "Email.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  // 获取玩家邮件列表
  rpc ReqPlayerEmailList(PlayerEmailListReq) returns (PlayerEmailListResp) {
    option (MetaInf.Meta) = {
      Mem: Read,
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  // 读取邮件
  rpc ReqReadEmail(ReadEmailReq) returns (ReadEmailResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  // 接收邮件
  rpc ReqReceiveEmail(ReceiveEmailReq) returns (ReceiveEmailResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  // 玩家删除邮件
  rpc ReqDeletePlayerEmail(DeletePlayerEmailReq) returns (DeletePlayerEmailResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  // 批量玩家删除邮件
  rpc ReqMultiDeletePlayerEmail(Empty) returns (MultiDeletePlayerEmailResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  // 领取邮件附件
  rpc ReqReceiveEmailAttachment(ReceiveEmailAttachmentReq) returns (ReceiveEmailAttachmentResp) {
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 5
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  }

  //邮件列表
  rpc ReqEmailBoxList(EmailBoxListReq) returns (EmailBoxListResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //请求邮件信息
  rpc ReqEmailBoxInfo(EmailBoxInfoReq) returns (EmailBoxInfoResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //发送邮件
  rpc ReqSendEmail(SendEmailReq) returns (SendEmailResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      Replay: {
        CacheTime: 5
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //修改邮件
  rpc ReqUpdateEmailBox(UpdateEmailBoxReq) returns (UpdateEmailBoxResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      Replay: {
        CacheTime: 5
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //删除邮件
  rpc ReqDeleteEmailBox(DeleteEmailBoxReq) returns (DeleteEmailBoxResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      Replay: {
        CacheTime: 5
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //撤回邮件
  rpc ReqUnSendEmail(UnSendEmailReq) returns (UnSendEmailResp) {
    option (MetaInf.Meta) = {
     Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ManagerRoles: [MR_SuperAdmin],
      Replay: {
        CacheTime: 5
      },
      SessionConfig: {
        Rand: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
}

/** **************** message **************** **/

//玩家邮件列表请求体
message PlayerEmailListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  bool OnlyUnread = 3; // 是否只看未读邮件，默认false
}
//玩家邮件列表响应体
message PlayerEmailListResp {
  RespCode Result = 1; //结果
  int32 TotalCount = 2; //邮件总数
  int32 UnreadCount = 3; //未读邮件总数
  repeated EmailData EmailList = 4; //邮件列表
}

//接收邮件请求体
message ReceiveEmailReq {
  string EmailData = 1; // 邮件数据
}
//接收邮件响应体
message ReceiveEmailResp {
  RespCode Result = 1; //结果
}

//读取邮件请求体
message ReadEmailReq {
  int64 EmailId = 1 [jstype = JS_STRING]; // 邮件id
}
//读取邮件响应体
message ReadEmailResp {
  RespCode Result = 1; //结果
  EmailData EmailInfo = 2; //邮件信息
  int32 UnreadCount = 3; //未读邮件总数
}

//领取邮件附件请求体
message ReceiveEmailAttachmentReq {
  int64 EmailId = 1 [jstype = JS_STRING]; // 邮件id
}
//领取邮件附件响应体
message ReceiveEmailAttachmentResp {
  RespCode Result = 1; //结果
  repeated EmailReceiveData EmailList = 2; // 邮件领取列表
}

//玩家删除邮件请求体
message DeletePlayerEmailReq {
  int64 EmailId = 1 [jstype = JS_STRING]; // 邮件id
}
//玩家删除邮件响应体
message DeletePlayerEmailResp {
  RespCode Result = 1; //结果
}

//玩家批量删除邮件响应体
message MultiDeletePlayerEmailResp {
  RespCode Result = 1; //结果
}

//邮件列表请求体
message EmailBoxListReq {
  int32 PageNumber = 1; //页码
  int32 PageSize = 2; //每页数量
  string Condition = 3; //条件
  int64 GameServerId = 4 [jstype = JS_STRING]; //游戏服id
}
//邮件列表响应体
message EmailBoxListResp {
  RespCode Result = 1; //结果
  int32 TotalCount = 2; //全服邮件总数
  repeated EmailBoxData List = 3; //全服邮件列表
}

//邮件信息请求体
message EmailBoxInfoReq {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件id
}
//邮件信息响应体
message EmailBoxInfoResp {
  RespCode Result = 1; //结果
  EmailBoxData Info = 2; //全服邮件信息
}

//发送邮件请求体
message SendEmailReq {
  string Title = 1; //邮件标题
  string Content = 2; //邮件内容
  int32 SendTime = 3; //发送时间 0为立即发送
  repeated AttachmentData AttachmentList = 4; // 附件列表
  string Receiver = 5; //接收者
  int32 TemplateId = 6; //邮件模板id
  int64 GameServerId = 7 [jstype = JS_STRING]; //游戏服id
  EmailIsOnline IsOnline = 8; //是否在线发送
}
//发送邮件响应体
message SendEmailResp {
  RespCode Result = 1; //结果
}

//修改邮件请求体
message UpdateEmailBoxReq {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件id
  string Title = 2; //邮件标题
  string Content = 3; //邮件内容
  int32 SendTime = 4; //发送时间 0为立即发送
  repeated AttachmentData AttachmentList = 5; // 附件列表
  string Receiver = 6; //接收者
  int32 TemplateId = 7; //邮件模板id
  int64 GameServerId = 8 [jstype = JS_STRING]; //游戏服id
  EmailIsOnline IsOnline = 9; //是否在线发送
}
//修改邮件响应体
message UpdateEmailBoxResp {
  RespCode Result = 1; //结果
}

//删除邮件请求体
message DeleteEmailBoxReq {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件id
}
//删除邮件响应体
message DeleteEmailBoxResp {
  RespCode Result = 1; //结果
}

//撤回邮件请求体
message UnSendEmailReq {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件id
}
//撤回邮件响应体
message UnSendEmailResp {
  RespCode Result = 1; //结果
}
