syntax = "proto3";

package Sms;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Sms";
option csharp_namespace = "Shared.Proto.Sms";

/** **************** message **************** **/

message Empty {}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
}

/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  OPERATE_LOCK_FAILURE = 7; //操作加锁失败
  //...
  VERIFY_CODE_DAY_SEND_MAX_NUM = 10; //验证码发送最大次数
  PHONE_FORMAT_INVALID = 11; //手机号格式不合法
  VERIFY_CODE_SEND_FAILURE = 12; //验证码发送失败
  VERIFY_CODE_SEND_TOO_FREQUENT = 13; //验证码发送过于频繁
  SMS_CONFIG_NOT_FOUND = 14; //短信配置未找到
  EMAIL_FORMAT_INVALID = 15; //邮箱格式不合法
  EMAIL_CONFIG_NOT_FOUND = 16; //邮箱配置未找到
  EMAIL_ADDRESS_VERIFY_INVALID = 17; //邮箱地址检测不通过
  EMAIL_SEND_FAILURE = 18; //邮箱发送失败
}
