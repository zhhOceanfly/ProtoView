syntax = "proto3";

package Email;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Email";
option csharp_namespace = "Shared.Proto.Email";

/** **************** message **************** **/

message Empty {}

//邮件数据
message EmailData {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件ID
  string Title = 2; //邮件标题
  string Content = 3; //邮件内容
  int32 SendTime = 4; //发送时间
  string SenderName = 5; // 发送者名称
  EmailState State = 6; //邮件状态
  repeated AttachmentData AttachmentList = 7; // 附件列表
  int64 EmailBoxId = 8 [jstype = JS_STRING]; //邮箱id
  int32 TemplateId = 9; //模板id
}

//附件数据
message AttachmentData {
  AttachmentType AttachType = 1; //附件类型
  int32 AttachId = 2; //附件id
  int32 Amount = 3; //数量
  string Other = 4; //其他
}

//邮件领取数据
message EmailReceiveData {
  EmailData EmailInfo = 1; // 邮件信息
  RespCode ReceiveCode = 2; //领取结果
}

//邮箱数据
message EmailBoxData {
  int64 EmailId = 1 [jstype = JS_STRING]; //邮件ID
  string Title = 2; //邮件标题
  string Content = 3; //邮件内容
  int32 SendTime = 4; //发送时间
  string SenderName = 5; // 发送者名称
  EmailBoxState State = 6; //邮件状态
  repeated AttachmentData AttachmentList = 7; // 附件列表
  int32 CreateTime = 8; //创建时间
  int32 TemplateId = 9; //模板id
  EmailIsOnline IsOnline = 10; //是否在线发送
  string Receiver = 11; //接收者
}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
  EVENT_NEW_EMAIL = 1; // 新邮件通知
  EVENT_RECEIVE_NEW_EMAIL = 2; // 接收新邮件通知
}

// 新邮件通知消息
message NewEmailEvt {
  EmailData EmailInfo = 1; // 邮件信息
}

// 接收新邮件通知消息
message ReceiveNewEmailEvt {
  string EmailData = 1; // 邮件数据
}


/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  //...
  EMAIL_NOT_EXIST = 10; //邮件不存在
  EMAIL_ALREADY_READ = 11; //邮件已读
  EMAIL_ATTACHMENT_ALREADY_RECEIVED = 12; //附件已领取
  EMAIL_NO_ATTACHMENT = 13; //邮件无附件
  EMAIL_EXPIRED = 14; // 邮件已过期
  EMAIL_DELETE_FAILED = 15; //邮件删除失败
  STORAGE_IS_FULL = 16; //仓库已满
  GOODS_AMOUNT_ERROR = 17; //物品数量错误
  SYSTEM_EMAIL_SEND_FAILED = 18; //系统邮件发送失败
  SCHEDULED_EMAIL_SEND_SUCCESS = 19; //定时发送成功
  EMAIL_NOT_COMPLETE = 20; //邮件内容不完整
  GOODS_NOT_EXIST = 21; //物品不存在
  EMAIL_TITLE_OVER_LENGTH = 22; //邮件标题超出长度
  EMAIL_CONTENT_OVER_LENGTH = 23; //邮件内容超出长度
  ATTACHMENT_TYPE_NOT_SUPPORT = 24; //附件类型不支持
  EMAIL_RECEIVER_ERROR = 25; //邮件接收者错误
  EMAIL_TEMPLATE_NOT_EXIST = 26; //邮件模板不存在
  EMAIL_ALREADY_SEND = 27; //邮件已发送或发送中
  EMAIL_ALREADY_UNSEND = 28; //邮件已撤回
  EMAIL_ALREADY_DELETE = 29; //邮件已删除
  EMAIL_NOT_ALLOW_OPERATE = 30; //邮件不允许操作
  PET_NOT_EXIST = 31; //宠物不存在
  PET_CAPACITY_IS_FULL = 32; // 宠物仓库已满
  EMAIL_ALREADY_DELETED = 33; //邮件已删除
}

//邮件状态
enum EmailState {
  ES_INIT = 0; //初始状态
  ES_READ = 1; //已读状态
  ES_UNRECEIVED = 2; //未领取状态
  ES_RECEIVED = 3; //已领取状态
  ES_DELETED = 4; //已删除状态
}

//附件类型
enum AttachmentType {
  AT_GOODS = 0; //物品类型
  AT_CURRENCY = 1; //货币类型
  AT_PET = 2; //宠物类型
}

//邮箱状态
enum EmailBoxState {
  EB_INIT = 0; //初始状态
  EB_ASSIGNING = 1; //分发中
  EB_ASSIGNED = 2; //已分发
  EB_DELETED = 3; //已删除
  EB_UNSEND = 4; //已撤回
}

//是否在线发送
enum EmailIsOnline {
  EIO_DEFAULT = 0; //默认
  EIO_ONLINE = 1; //在线
  EIO_OFFLINE = 2; //离线
}