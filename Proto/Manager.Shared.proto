syntax = "proto3";

package Manager;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Manager";

import "MetaInf.proto";

/** **************** message **************** **/

message Empty {}

//账户数据
message AcctData {
  int64 AcctId = 1 [jstype = JS_STRING]; //账户id
  string Name = 2; //账户名
  string Nickname = 3; //昵称
  string HeadImg = 4; //头像
  SexType Sex = 5; //性别
  string Phone = 6; //手机号
  string Email = 7; //邮箱
  string EmployeeId = 8; //工号
  MetaInf.ManagerRole RoleId = 9; //角色id
  int32 LastLoginTime = 10; //最后一次登录时间
  string LastLoginIp = 11; //最后一次登录ip
}

//token数据
message TokenData{
  string AccessToken = 1; //访问token
  string RefreshToken = 2; //刷新token
}

//物品信息
message GoodsInfo {
  int32 GoodsId = 1; //物品id
  int32 Category = 2; //物品分类
  string GoodsName = 3; //物品名称
}
//物品数据
message GoodsData {
  GoodsType Type = 1; //类型
  int32 GoodsId = 2; //物品id
  int32 Amount = 3; //物品数量
}

//失败玩家数据
message FailurePlayerData {
  string DisplayId = 1; //显示id
  RespCode Result = 2; //结果
}

//运维配置数据
message OpsConfigOssData {
  bool Exists = 1; //是否存在发布产物
  string ObjectKey = 2; //对象键/本地路径
  string ConfigJson = 3; //OSS 配置内容JSON
  int32 Version = 4; //OSS 配置版本
  bool Enabled = 5; //OSS 是否启用
  string Description = 6; //OSS 配置说明
  bool Matched = 7; //与数据库内容是否一致
}
message OpsConfigData {
  string ConfigKey = 1; //配置键
  string ConfigJson = 2; //数据库配置内容JSON
  int32 Version = 3; //数据库配置版本
  bool Enabled = 4; //数据库是否启用
  string Description = 5; //配置说明
  string ExampleJson = 6; //配置示例JSON
  OpsConfigOssData Oss = 7; //OSS/本地发布产物信息
}

//配置刷新请求体（均为 false 时表示四项全刷）
message ConfigUpdateReq {
  bool RefreshExcel = 1; //刷新 Excel/Luban
  bool RefreshJwt = 2; //刷新 Jwt 密钥
  bool RefreshOpsConfig = 3; //同步 OpsConfig 到 OSS 并广播刷新
  bool RefreshSetting = 4; //刷新业务 Setting 缓存（Player/Troop 等）
}
//配置刷新响应体
message ConfigUpdateResp {
  RespCode Result = 1; //结果
}

/** **************** push message **************** **/

//事件类型
enum EventType {
  EVENT_UNKNOWN = 0;
  //...
}

/** **************** enum **************** **/

enum RespCode {
  /** ========= common ========= **/
  FAILURE = 0; //失败
  SUCCESS  = 1; //成功
  INVALID_PARAM = 2; //参数错误
  DB_OPERATE_FAILURE = 3; //数据操作失败
  SERVER_CIRCUIT_FAILURE = 4; //服务熔断失败
  EVENT_DATA_EXPIRED = 5; //事件过期
  TX_CREATE_FAILURE = 6; //事务操作失败
  OPERATE_LOCK_FAILURE = 7; //操作加锁失败
  PERMISSION_DENIED = 8; //权限不足
  //...
  ACCOUNT_NOT_EXIST = 10; //账户不存在
  PASSWORD_LENGTH_INVALID = 11; //密码长度不合法
  PASSWORD_FORMAT_INVALID = 12; //密码格式不合法
  PASSWORD_ERROR = 13; //密码错误
  TOKEN_GEN_FAILURE = 14; //token生成失败
  REFRESH_TOKEN_ERROR = 15; //刷新token错误
  TOKEN_NOT_SAME = 16; //tokan不一致
  GOODS_NOT_EXIST = 17; //物品不存在
  GOODS_TYPE_NOT_SUPPORT = 18; //物品类型不支持
  GOODS_AMOUNT_ERROR = 19; //物品数量错误
  PLAYER_NOT_EXIST = 20; //玩家不存在
  GAME_PLAYER_NOT_EXIST = 21; //游戏服务器玩家不存在
  STORAGE_IS_FULL = 22; //仓库已满
  GAME_SERVER_NOT_EXIST = 23; //游戏服务器不存在
  ACCOUNT_NAME_FORMAT_INVALID = 24; //账户名格式不合法
  ACCOUNT_NAME_LENGTH_INVALID = 25; //账户名长度不合法
  ACCOUNT_NAME_SENSITIVE_INVALID = 26; //账户名敏感词不合法
  ACCOUNT_NAME_EXIST = 27; //账户名已存在
  ACCOUNT_NICKNAME_EXIST = 28; //昵称已存在
  ACCOUNT_NICKNAME_FORMAT_INVALID = 29; //昵称格式不合法
  ACCOUNT_NICKNAME_LENGTH_INVALID = 30; //昵称长度不合法
  ACCOUNT_NICKNAME_SENSITIVE_INVALID = 31; //昵称敏感词不合法
  SUPER_ADMIN_NOT_DELETE = 32; //超级管理员不可以被删除
  PHONE_INVALID = 33; //手机号不合法
  GROUP_ERROR = 34; //权限组错误
  OPS_CONFIG_NOT_FOUND = 35; //运维配置不存在
  OPS_CONFIG_KEY_EXIST = 36; //运维配置键已存在
  OPS_CONFIG_VERSION_CONFLICT = 37; //运维配置版本冲突
  OSS_CONFIG_TAG_NOT_FOUND = 38; //oss配置标签不存在
  JWT_CONFIG_INVALID = 39; //jwt配置不合法
  OSS_UPLOAD_FAILURE = 40; //oss上传失败
  RECHARGE_ORDER_NOT_EXIST = 41; //充值订单不存在
  RECHARGE_ORDER_STATE_ERROR = 42; //充值订单状态错误
  RECHARGE_REFUND_FAILURE = 43; //充值退款失败
  RECHARGE_REFUND_AMOUNT_ERROR = 44; //退款金额错误
  SERVICE_NOT_SUPPORT_K8S = 45; //服务不支持K8S
}

//性别
enum SexType {
  ST_UNKNOWN = 0; //未知
  ST_MALE = 1; //男
  ST_FEMALE = 2; //女
}

//物品类型
enum GoodsType {
  GT_GOODS = 0; //物品类型
  GT_CURRENCY = 1; //货币类型
}
