syntax = "proto3";

package Finance;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Finance";
option csharp_namespace = "Shared.Proto.Finance";

import "MetaInf.proto";
import "Finance.Shared.proto";

/** **************** service **************** **/

// 服务定义
service PublicService {
  //充值档位列表
  rpc ReqRechargeProductList(Empty) returns (RechargeProductListResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Mem: Read,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME]
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //创建充值订单
  rpc ReqRechargeCreate(RechargeCreateReq) returns (RechargeCreateResp){
    option (MetaInf.Meta) = {
      Timeout: 30,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME]
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      Idempotent: {
        Verify: true,
        CacheTime: 60
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //查询充值订单
  rpc ReqRechargeOrder(RechargeOrderReq) returns (RechargeOrderResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Mem: Read,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME]
      },
      ClientRoles: [CR_Default],
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //玩家货币
  rpc ReqPlayerCurrency(Empty) returns (PlayerCurrencyResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Mem: Read,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_PLAYER],
        Tags: [AU_GAME],
        JtiCheck: {
          ClientTtl: 10
        }
      },
      ClientRoles: [CR_Default],
      Replay: {
        CacheTime: 10
      },
      SessionConfig: {
        UserMod: {}
      },
      LimitConfig: {
        UserMethodLimit: {
          TimeWindow: 1,
          CallCount: 3,
          BanTime: 2
        }
      }
    };
  };
  //保存货币设置
  rpc ReqSaveCurrencySetting(SaveCurrencySettingReq) returns (SaveCurrencySettingResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER]
      },
      ManagerRoles: [MR_SuperAdmin],
      SessionConfig: {
        GameMod: {}
      },
      LimitConfig: {
      }
    };
  };
  //获取货币设置
  rpc ReqCurrencySetting(Empty) returns (CurrencySettingResp){
    option (MetaInf.Meta) = {
      Timeout: 15,
      Mem: Read,
      AuthConfig: {
        AuthOption: JWT_AUTH,
        JwtSources: [JS_MANAGER]
      },
      ManagerRoles: [MR_SuperAdmin],
      SessionConfig: {
        GameMod: {}
      },
      LimitConfig: {
      }
    };
  };
}

/** **************** message **************** **/

//保存货币设置请求体
message SaveCurrencySettingReq {
  int32 CurrencyOneAmount = 1; //100001货币初始数量
  int32 CurrencyTwoAmount = 2; //100002货币初始数量
  int32 CurrencyThreeAmount = 3; //100003货币初始数量
}
//保存货币设置响应体
message SaveCurrencySettingResp {
  RespCode Result = 1; //结果
  int32 CurrencyOneAmount = 2; //100001货币初始数量
  int32 CurrencyTwoAmount = 3; //100002货币初始数量
  int32 CurrencyThreeAmount = 4; //100003货币初始数量
}
//获取货币设置响应体
message CurrencySettingResp {
  RespCode Result = 1; //结果
  int32 CurrencyOneAmount = 2; //100001货币初始数量
  int32 CurrencyTwoAmount = 3; //100002货币初始数量
  int32 CurrencyThreeAmount = 4; //100003货币初始数量
}

//创建充值订单请求体
message RechargeCreateReq {
  int32 ProductId = 1; //充值档位id
}
//创建充值订单响应体
message RechargeCreateResp {
  RespCode Result = 1; //结果
  RechargeOrderInfo Order = 2; //充值订单
}
//查询充值订单请求体
message RechargeOrderReq {
  string OrderNo = 1; //游戏侧订单号
}
//查询充值订单响应体
message RechargeOrderResp {
  RespCode Result = 1; //结果
  RechargeOrderInfo Order = 2; //充值订单
}

//充值档位列表响应体
message RechargeProductListResp {
  RespCode Result = 1; //结果
  repeated RechargeProduct Products = 2; //充值档位
}

//玩家货币响应体
message PlayerCurrencyResp {
  RespCode Result = 1; //结果
  CurrencyData Info = 2; //货币信息
}
