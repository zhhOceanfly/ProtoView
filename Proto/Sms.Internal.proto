syntax = "proto3";

package Sms;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Sms";
option csharp_namespace = "Shared.Proto.Sms";

import "MetaInf.proto";
import "Sms.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //内部发送验证码
  rpc ReqBaseSendVerifyCode(SendVerifyCodeReq) returns (SendVerifyCodeResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  //内部发送邮箱验证码
  rpc ReqBaseSendEmailVerifyCode(SendEmailVerifyCodeReq) returns (SendEmailVerifyCodeResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
}

/** **************** message **************** **/

//发送验证码请求体
message SendVerifyCodeReq {
  string Phone = 1; //手机号
  string ConfigTag = 2; //可选配置标签，例如 aliyun:register；为空时使用服务端默认配置
  repeated string Params = 3; //参数
}
//发送验证码响应体
message SendVerifyCodeResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签，例如 aliyun:register
}

//发送邮箱验证码请求体
message SendEmailVerifyCodeReq {
  string Email = 1; //邮箱
  string ConfigTag = 2; //可选配置标签，例如 aliyun:register；为空时使用服务端默认配置
  string VerifyCode = 3; //验证码
}
//发送邮箱验证码响应体
message SendEmailVerifyCodeResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签，例如 aliyun:register
}
