syntax = "proto3";

package Backpack;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Backpack";
option csharp_namespace = "Shared.Proto.Backpack";

import "MetaInf.proto";
import "Backpack.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //pod一致性检查 
  rpc ReqInternalPodConsistCheck(Empty) returns (InternalPodConsistCheckResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  };

  //查询玩家仓库物品
  rpc ReqInternalPlayerStorageList(InternalPlayerStorageListReq) returns (InternalPlayerStorageListResp){
    option (MetaInf.Meta) = {
      Mem: Read,
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  //玩家使用仓库物品
  rpc ReqPlayerUseStorageGoods(PlayerUseStorageGoodsReq) returns (PlayerUseStorageGoodsResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  //玩家改变仓库物品位置
  rpc ReqPlayerStorageChangeSite(PlayerStorageChangeSiteReq) returns (PlayerStorageChangeSiteResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  //玩家丢弃仓库物品
  rpc ReqPlayerStorageDiscardGoods(PlayerStorageDiscardGoodsReq) returns (PlayerStorageDiscardGoodsResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  //批量持久化装备耐久度
  rpc ReqMultiPersistEquipDurability(MultiPersistEquipDurabilityReq) returns (MultiPersistEquipDurabilityResp){
    option (MetaInf.Meta) = {
      Closed: false,
      SessionConfig: {
        GameMod: {}
      },
      PodConsistCheck: true
    };
  }
  //持久化装备耐久度
  rpc ReqPersistEquipDurability(PersistEquipDurabilityReq) returns (PersistEquipDurabilityResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  }
  //内部批量玩家仓库物品变动处理-暂时废弃
  // rpc ReqMultiStorageGoodsChange(MultiStorageGoodsChangeReq) returns (MultiStorageGoodsChangeResp){
  //   option (MetaInf.Meta) = {
  //     SessionConfig: {
  //       UserMod: {}
  //     },
  //     PodConsistCheck: true
  //   };
  // }
  //内部仓库物品变动处理
  rpc ReqStorageGoodsChange(StorageGoodsChangeReq) returns (StorageGoodsChangeResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true,
      ConsistCheck: true
    };
  }
  //玩家取出制造装备
  rpc ReqPlayerPickBuildEquip(PlayerPickBuildEquipReq) returns (PlayerPickBuildEquipResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  }
  //玩家取出维修装备
  rpc ReqPlayerPickRepairEquip(PlayerPickRepairEquipReq) returns (PlayerPickRepairEquipResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  }
  //玩家升级装备
  rpc ReqPlayerUpgradeEquip(PlayerUpgradeEquipReq) returns (PlayerUpgradeEquipResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };

  //查询玩家技能栏
  rpc ReqInternalPlayerSkillBar(Empty) returns (InternalPlayerSkillBarResp){
    option (MetaInf.Meta) = {
      Mem: Read,
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  // 玩家修改技能栏
  rpc ReqPlayerUpdateSkillBar(UpdateSkillBarReq) returns (UpdateSkillBarResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };

  //查询玩家载具栏
  rpc ReqInternalGetPlayerCarBar(Empty) returns (GetPlayerCarBarResp){
    option (MetaInf.Meta) = {
      Mem: Read,
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  // 玩家修改载具栏
  rpc ReqInternalUpdatePlayerCarBar(UpdatePlayerCarBarReq) returns (UpdatePlayerCarBarResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true
    };
  };
  // 玩家使用武器皮肤
  rpc ReqInternalPlayerUseEquipmentCloth(PlayerUseEquipmentClothReq) returns (PlayerUseEquipmentClothResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  };
  // 玩家卸下武器皮肤
  rpc ReqInternalPlayerUnuseEquipmentCloth(PlayerUnuseEquipmentClothReq) returns (PlayerUnuseEquipmentClothResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      }
    };
  };

  //内部玩家死亡掉落物品处理
  rpc ReqPlayerDeathDropGoods(PlayerDeathDropGoodsReq) returns (PlayerDeathDropGoodsResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        UserMod: {}
      },
      PodConsistCheck: true,
      ConsistCheck: true
    };
  };
}

/** **************** message **************** **/

//一致性检查响应
message InternalPodConsistCheckResp {
  RespCode Result = 1; //结果
  repeated PodConsistCache CacheList = 2; //缓存列表
}
//一致性缓存
message PodConsistCache {
  string Name = 1; //缓存名称
  bool Cached = 2; //是否缓存
  bytes Data = 3; //数据
}

//内部玩家仓库列表请求体
message InternalPlayerStorageListReq {
  repeated GoodsSite Sites = 1; //位置列表
  int32 GoodsCategory = 2; //物品分类
  int32 GoodsId = 3; //物品id
}
//内部玩家仓库列表响应体
message InternalPlayerStorageListResp {
  RespCode Result = 1; //结果
  repeated StorageData List = 2; //仓库列表
  repeated EquipmentClothBindData EquipmentClothBindList = 3; //武器皮肤穿戴绑定列表
}
//武器皮肤穿戴绑定数据
message EquipmentClothBindData {
  int32 EquipmentId = 1; //装备/武器id
  int32 ClothId = 2; //皮肤id
}
//玩家使用武器皮肤请求体
message PlayerUseEquipmentClothReq {
  int32 ClothId = 1; //皮肤id
  repeated int32 EquipmentIds = 2; //目标武器id列表 空-按配置适配全量绑定
}
//玩家使用武器皮肤响应体
message PlayerUseEquipmentClothResp {
  RespCode Result = 1; //结果
}
//玩家卸下武器皮肤请求体
message PlayerUnuseEquipmentClothReq {
  int32 ClothId = 1; //皮肤id
  repeated int32 EquipmentIds = 2; //目标武器id列表 空-卸下全部武器上的该皮肤
}
//玩家卸下武器皮肤响应体
message PlayerUnuseEquipmentClothResp {
  RespCode Result = 1; //结果
}

//仓库物品使用请求体
message PlayerUseStorageGoodsReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 GoodsAmount = 2; //使用数量
}
//仓库物品使用响应体
message PlayerUseStorageGoodsResp {
  RespCode Result = 1; //结果
  int32 GoodsId = 2; //物品id
  int32 GoodsAmount = 3; //使用数量
}

//改变仓库物品位置请求体
message PlayerStorageChangeSiteReq {
  int64 ChangeStorageId = 1 [jstype = JS_STRING]; //改变仓库id
  int64 ChangedStorageId = 2 [jstype = JS_STRING]; //被改变仓库id
  GoodsSite ChangeSite = 3; //改变位置
  GoodsSite ChangedSite = 4; //被改变位置
  int32 ChangedPosId = 5; //被改变位置id
}
//改变仓库物品位置响应体
message PlayerStorageChangeSiteResp {
  RespCode Result = 1; //结果
  StorageChangeData EquipData = 2; //装备数据
  StorageChangeData UnEquipData = 3; //卸下装备数据
}

//仓库物品丢弃请求体
message PlayerStorageDiscardGoodsReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 GoodsAmount = 2; //丢弃物品数量
}
//仓库物品丢弃响应体
message PlayerStorageDiscardGoodsResp {
  RespCode Result = 1; //结果
}

//批量持久化装备耐久度请求体
message MultiPersistEquipDurabilityReq {
  repeated EquipDurability List = 1; //装备耐久度列表
}
//批量持久化装备耐久度响应体
message MultiPersistEquipDurabilityResp {
  RespCode Result = 1; //结果
}
//装备耐久度结构体
message EquipDurability {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int64 PlayerId = 2 [jstype = JS_STRING]; //玩家id
  int32 Durability = 3; //耐久度
}

//持久化装备耐久度请求体
message PersistEquipDurabilityReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 Durability = 2; //耐久度
}
//持久化装备耐久度响应体
message PersistEquipDurabilityResp {
  RespCode Result = 1; //结果
}

//批量玩家仓库物品变动请求体
message MultiStorageGoodsChangeReq {
  GoodsSite Site = 1; //位置
  ChangeType ChangeType = 2; //变动类型
  repeated GoodsChangeData List = 3; //变动列表
  repeated int64 PlayerIds = 4 [jstype = JS_STRING]; //玩家id列表
}
//批量玩家仓库物品变动响应体
message MultiStorageGoodsChangeResp {
  RespCode Result = 1; //结果 枚举值
  repeated FailurePlayerData FailureList = 2; //失败列表
}
//仓库物品变动请求体
message StorageGoodsChangeReq {
  GoodsSite Site = 1; //位置
  ChangeType ChangeType = 2; //变动类型
  repeated GoodsChangeData List = 3; //变动列表
  StorageFullStrategy FullStrategy = 4; //满时策略
}
//仓库物品变动响应体
message StorageGoodsChangeResp{ 
  RespCode Result = 1; //结果 枚举值
  repeated DropGoodsData EnoughList = 2; //多余列表
}
//物品变动数据结构体
message GoodsChangeData {
  bool IsGain = 1; //是否获得
  int32 GoodsId = 2; //物品id
  int32 ChangeAmount = 3; //变动数量
  int32 Durability = 4; //耐久度
}

//玩家取出制造装备求体
message PlayerPickBuildEquipReq {
  int64 BuildId = 1 [jstype = JS_STRING]; //制造id
}
//玩家取出制造请装备响应体
message PlayerPickBuildEquipResp {
  RespCode Result = 1; //结果 枚举值
}

//玩家取出维修装备求体
message PlayerPickRepairEquipReq {
  int64 RepairId = 1 [jstype = JS_STRING]; //维修id
}
//玩家取出维修装备响应体
message PlayerPickRepairEquipResp {
  RespCode Result = 1; //结果 枚举值
}

//升级装备请求体
message PlayerUpgradeEquipReq {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 Durability = 2; //耐久度
  bool UseStorage = 3; //是否可使用仓库物品
}
//升级装备响应体
message PlayerUpgradeEquipResp {
  RespCode Result = 1; //结果
  StorageChangeData UpgradedEquip = 2; //升级后装备数据
}

//玩家技能栏响应体
message InternalPlayerSkillBarResp {
  RespCode Result = 1; //结果 枚举值
  repeated int32 SkillIds = 2; //技能id列表
}
//玩家修改技能栏请求体
message UpdateSkillBarReq {
  repeated int32 SkillIds = 1; //技能id列表
}
//玩家修改技能栏响应体
message UpdateSkillBarResp {
  RespCode Result = 1; //结果
}

//查询玩家载具栏响应体
message GetPlayerCarBarResp {
  RespCode Result = 1; //结果
  repeated int32 CarIds = 2; //载具id列表
}
//更新玩家载具栏请求体
message UpdatePlayerCarBarReq {
  repeated int32 CarIds = 1; //载具id列表
}
//更新玩家载具栏响应体
message UpdatePlayerCarBarResp {
  RespCode Result = 1; //结果
}

//玩家死亡掉落物品请求体
message PlayerDeathDropGoodsReq {
  int32 ServerId = 1; //物理服务器id
  repeated EquipmentDurabilityData EquipmentDurabilityList = 2; //装备耐久度列表
}
//玩家死亡掉落物品响应体
message PlayerDeathDropGoodsResp {
  RespCode Result = 1; //结果 枚举值
}
//装备耐久度数据
message EquipmentDurabilityData {
  int64 StorageId = 1 [jstype = JS_STRING]; //仓库id
  int32 Durability = 2; //耐久度
}