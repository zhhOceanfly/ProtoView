syntax = "proto3";

package Pay;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Pay";
option csharp_namespace = "Shared.Proto.Pay";

import "MetaInf.proto";
import "Pay.Shared.proto";

/** **************** service **************** **/

// 内部服务定义
service InternalService {
  //统一下单
  rpc ReqBasePreCreate(BasePreCreateReq) returns (BasePreCreateResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  //订单查询
  rpc ReqBaseQuery(BaseQueryReq) returns (BaseQueryResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  //关闭订单
  rpc ReqBaseClose(BaseCloseReq) returns (BaseCloseResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  //申请退款
  rpc ReqBaseRefund(BaseRefundReq) returns (BaseRefundResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
  //退款查询
  rpc ReqBaseRefundQuery(BaseRefundQueryReq) returns (BaseRefundQueryResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
    };
  };
}

/** **************** message **************** **/

//统一下单请求体
message BasePreCreateReq {
  string ConfigTag = 1; //支付配置标签，例如 citic.local；必须指定
  string MchId = 2; //商户号
  string OutTradeNo = 3; //商户订单号
  string Body = 4; //商品描述
  int32 TotalFee = 5; //订单金额，单位分
  string MchCreateIp = 6; //终端IP
  string NotifyUrl = 7; //通知地址
  string DeviceInfo = 8; //终端设备号
  string Attach = 9; //附加数据
  string TimeStart = 10; //交易起始时间
  string TimeExpire = 11; //交易结束时间
}
//统一下单响应体
message BasePreCreateResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签
  string CodeUrl = 3; //聚合二维码内容
  string CodeImgUrl = 4; //二维码图片地址
  string Uuid = 5; //平台订单唯一标识
}

//订单查询请求体
message BaseQueryReq {
  string ConfigTag = 1; //支付配置标签，例如 citic.local；必须指定
  string MchId = 2; //商户号
  string OutTradeNo = 3; //商户订单号
  string TransactionId = 4; //平台订单号
}
//订单查询响应体
message BaseQueryResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签
  TradeState TradeState = 3; //交易状态
  string TradeType = 4; //交易类型
  string TransactionId = 5; //平台订单号
  string OutTransactionId = 6; //第三方订单号
  string OutTradeNo = 7; //商户订单号
  int32 TotalFee = 8; //总金额，单位分
  int32 CashFee = 9; //现金支付金额
  int32 CouponFee = 10; //现金券金额
  string FeeType = 11; //货币种类
  string BankType = 12; //付款银行
  string TimeEnd = 13; //支付完成时间
}

//关闭订单请求体
message BaseCloseReq {
  string ConfigTag = 1; //支付配置标签，例如 citic.local；必须指定
  string MchId = 2; //商户号
  string OutTradeNo = 3; //商户订单号
}
//关闭订单响应体
message BaseCloseResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签
  string RetryFlag = 3; //是否需要重试
  string OutTradeNo = 4; //商户订单号
  string TransactionId = 5; //平台订单号
  string OutTransactionId = 6; //第三方订单号
}

//申请退款请求体
message BaseRefundReq {
  string ConfigTag = 1; //支付配置标签，例如 citic.local；必须指定
  string MchId = 2; //商户号
  string OutTradeNo = 3; //商户订单号
  string TransactionId = 4; //平台订单号
  string OutRefundNo = 5; //商户退款单号
  int32 TotalFee = 6; //订单总金额，单位分
  int32 RefundFee = 7; //退款金额，单位分
  string OpUserId = 8; //操作员
  string RefundChannel = 9; //退款渠道
  string Attach = 10; //附加数据
}
//申请退款响应体
message BaseRefundResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签
  string TransactionId = 3; //平台订单号
  string OutTradeNo = 4; //商户订单号
  string OutTransactionId = 5; //第三方订单号
  string OutRefundNo = 6; //商户退款单号
  string RefundId = 7; //平台退款单号
  string RefundChannel = 8; //退款渠道
  int32 RefundFee = 9; //退款金额，单位分
  string TradeType = 10; //交易类型
}

//退款查询请求体
message BaseRefundQueryReq {
  string ConfigTag = 1; //支付配置标签，例如 citic.local；必须指定
  string MchId = 2; //商户号
  string OutTradeNo = 3; //商户订单号
  string TransactionId = 4; //平台订单号
  string OutRefundNo = 5; //商户退款单号
  string RefundId = 6; //平台退款单号
}
//单笔退款明细
message RefundDetailData {
  string OutRefundNo = 1; //商户退款单号
  string RefundId = 2; //平台退款单号
  string OutRefundId = 3; //第三方退款单号
  string RefundChannel = 4; //退款渠道
  int32 RefundFee = 5; //退款金额，单位分
  int32 CouponRefundFee = 6; //现金券退款金额
  string RefundTime = 7; //退款时间
  RefundState RefundStatus = 8; //退款状态
  string RefundStatusInfo = 9; //退款状态描述
}
//退款查询响应体
message BaseRefundQueryResp {
  RespCode Result = 1; //结果
  string SelectedConfigTag = 2; //实际使用的配置标签
  string TransactionId = 3; //平台订单号
  string OutTradeNo = 4; //商户订单号
  string OutTransactionId = 5; //第三方订单号
  int32 RefundCount = 6; //退款笔数
  string TradeType = 7; //交易类型
  repeated RefundDetailData Refunds = 8; //退款明细列表
}
