/** **************** message **************** **/

//发送服内聊天请求体
message SendGameServerChatReq {
  string Message = 1; //消息
}
//发送服内聊天响应体
message SendGameServerChatResp {
  RespCode Result = 1; //结果
  int32 LeftTime = 2; //聊天剩余等待时间
}

//发送队伍聊天请求体
message SendTroopChatReq {
  int64 TroopId = 1 [jstype = JS_STRING]; //团队id
  string Message = 2; //消息
}
//发送队伍聊天响应体
message SendTroopChatResp {
  RespCode Result = 1; //结果
  int32 LeftTime = 2; //聊天剩余等待时间
}

//发送小队聊天请求体
message SendTeamChatReq {
  int64 TeamId = 1 [jstype = JS_STRING]; //小队id
  string Message = 2; //消息
}
//发送小队聊天响应体
message SendTeamChatResp {
  RespCode Result = 1; //结果
  int32 LeftTime = 2; //聊天剩余等待时间
}

//发送本地聊天请求体
message SendLocalChatReq {
  string Message = 1; //消息
}
//发送本地聊天响应体
message SendLocalChatResp {
  RespCode Result = 1; //结果
}

//服内聊天记录响应体
message GameServerChatListResp {
  RespCode Result = 1; //结果
  repeated ChatMsg List = 2; //聊天记录列表
}

//团队聊天记录请求体
message GameTroopChatListReq {
  int64 TroopId = 1 [jstype = JS_STRING]; //团队id
}
//团队聊天记录响应体
message GameTroopChatListResp {
  RespCode Result = 1; //结果
  repeated ChatMsg List = 2; //聊天记录列表
}

//小队聊天记录请求体
message GameTeamChatListReq {
  int64 TeamId = 1 [jstype = JS_STRING]; //小队id
}
//小队聊天记录响应体
message GameTeamChatListResp {
  RespCode Result = 1; //结果
  repeated ChatMsg List = 2; //聊天记录列表
}

//系统消息记录响应体
message GameSystemChatListResp {
  RespCode Result = 1; //结果
  repeated ChatMsg List = 2; //聊天记录列表
}

