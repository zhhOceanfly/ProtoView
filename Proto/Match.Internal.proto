syntax = "proto3";

package Match;
option go_package = "gitea.zhenyueyouguang.com/team2/Mountain.Server/src/Shared/Proto/Match";
option csharp_namespace = "Shared.Proto.Match";

import "MetaInf.proto";
import "Match.Shared.proto";

/** **************** service **************** **/

service InternalService {
  //内部申请创建场景
  rpc ReqInternalApplyCreateScene(ApplyCreateSceneReq) returns (ApplyCreateSceneResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //内部加入场景校验
  rpc ReqInternalJoinSceneVerify(JoinSceneVerifyReq) returns (JoinSceneVerifyResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //内部跳转场景
  rpc ReqInternalJumpScene(JumpSceneReq) returns (JumpSceneResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //内部离开服务器
  rpc ReqInternalLeaveServer(LeaveServerReq) returns (LeaveServerResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //内部获取服务器场景列表
  rpc ReqInternalSceneList(SceneListReq) returns (SceneListResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        ServerRand: {}
      },
      CacheConfig: {
        ClientTtl: 10,
        ServerTtl: 0
      }
    };
  };
  //内部设置服务器玩家名称
  rpc ReqInternalSetServerPlayerName(InternalSetServerPlayerNameReq) returns (InternalSetServerPlayerNameResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //上报副本通关结果
  rpc ReqInternalSubmitDungeonResult(SubmitDungeonResultReq) returns (SubmitDungeonResultResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //确认停止服务器场景
  rpc ReqInternalConfirmStopScene(ConfirmStopSceneReq) returns (ConfirmStopSceneResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //同步服务器玩家状态
  rpc ReqInternalSyncPlayerState(SyncPlayerStateReq) returns (SyncPlayerStateResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };
  //上报服务器在线玩家数据
  rpc ReqInternalSubmitOnlinePlayer(SubmitOnlinePlayerReq) returns (SubmitOnlinePlayerResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        GameMod: {}
      },
    };
  };

  //获取游戏服缓存列表
  rpc ReqGameServerCacheList(GameServerCacheListReq) returns (GameServerCacheListResp){
    option (MetaInf.Meta) = {
      Closed: true,
      SessionConfig: {
        Rand: {}
      },
      CacheConfig: {
        ClientTtl: 30,
        ServerTtl: 0
      }
    };
  };
  //获取游戏服务器玩家缓存列表
  rpc ReqInternalPlayerCacheList(PlayerCacheListReq) returns (PlayerCacheListResp){
    option (MetaInf.Meta) = {
      SessionConfig: {
        Rand: {}
      },
      CacheConfig: {
        ClientTtl: 10,
        ServerTtl: 0
      }
    };
  };
}

/** **************** message **************** **/

//申请创建场景请求体
message ApplyCreateSceneReq {
  int32 MapId = 1; //地图id
  int32 MapType = 2; //地图类型
  int32 MaxPeople = 3; //最大人数
  int32 DungeonId = 4; //副本id
  SceneOther Other = 5; //场景其他配置
}
//申请创建场景响应体
message ApplyCreateSceneResp {
  RespCode Result = 1; //结果
  int64 GameServerId = 2 [jstype = JS_STRING]; //游戏服务器id
  int64 SceneId = 3 [jstype = JS_STRING]; //场景id
  int32 MapId = 4; //地图id
  int32 DungeonId = 5; //副本id
}
// 场景其他配置
message SceneOther {
  int64 ChallengeId = 1 [jstype = JS_STRING]; //副本挑战id
  repeated int64 AllowPlayerIds = 2 [jstype = JS_STRING]; //允许玩家id
}

//加入场景校验请求体
message JoinSceneVerifyReq {
  string JoinToken = 1; //预加入token
}
//加入场景校验响应体
message JoinSceneVerifyResp {
  RespCode Result = 1; //结果
  repeated SceneData SceneList = 2; //场景列表
  PlayerSceneData PlayerSceneInfo = 3; //玩家场景信息
}
//玩家场景数据结构体
message PlayerSceneData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  int64 GameServerId = 2 [jstype = JS_STRING]; //游戏服务器id
  int64 SceneId = 3 [jstype = JS_STRING]; //场景id
  string GameServerPlayerName = 4; //游戏服务器玩家名称
  int32 MapId = 6; //地图id
}

//跳转场景请求体
message JumpSceneReq {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  int32 MapType = 2; //地图类型
  int32 MapId = 3; //地图id
  int64 JumpSceneId = 4 [jstype = JS_STRING]; //跳转场景id
}
//跳转场景响应体
message JumpSceneResp {
  RespCode Result = 1; //结果
  int64 ServerId = 2 [jstype = JS_STRING]; //服务器id
  int64 GameServerId = 3 [jstype = JS_STRING]; //游戏服务器id
  string JoinToken = 4; //预加入token
  string PhysicalServerAddr = 5; //物理服务器地址
}

//离开服务器请求体
message LeaveServerReq {
  LeaveReason Reason = 1; //踢掉原因
}
//离开服务器响应体
message LeaveServerResp {
  RespCode Result = 1; //结果
}

//场景列表请求体
message SceneListReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
  int32 PhysicalServerId = 2; //物理服务器id
}
//场景列表响应体
message SceneListResp {
  RespCode Result = 1; //结果
  repeated SceneData SceneList = 2; //场景
}

//上报副本通关结果请求体
message SubmitDungeonResultReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //场景id
  int64 PlayerId = 2 [jstype = JS_STRING]; //玩家id
  int32 BeatTime = 3; //通关时间
  int32 OpenTime = 4; //开启时间
}
//上报副本通关结果响应体
message SubmitDungeonResultResp {
  RespCode Result = 1; //结果
}

//确认停止服务器场景请求体
message ConfirmStopSceneReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //场景id
}
//确认停止服务器场景响应体
message ConfirmStopSceneResp {
  RespCode Result = 1; //结果
}

//同步玩家状态请求体
message SyncPlayerStateReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //场景id
  int64 PlayerId = 2 [jstype = JS_STRING]; //玩家id
  OnlineState State = 3; //状态
  LeaveReason OfflineReason = 4; //离线原因
}
//同步玩家状态响应体
message SyncPlayerStateResp {
  RespCode Result = 1; //结果
}
//上报在线玩家请求体
message SubmitOnlinePlayerReq {
  int64 SceneId = 1 [jstype = JS_STRING]; //场景id
  repeated ScenePlayerData PlayerList = 2; //场景玩家id列表
}
//上报在线玩家响应体
message SubmitOnlinePlayerResp {
  RespCode Result = 1; //结果
  repeated GameServerPlayerKickout KickoutList = 2; //被踢列表
}
//场景玩家状态数据结构体
message ScenePlayerData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  OnlineState State = 2; //状态
}

//上报场景数据请求体
message SubmitSceneDataReq {
  repeated int64 PlayerIds = 1 [jstype = JS_STRING]; //玩家数组
}
//上报场景数据响应体
message SubmitSceneDataResp {
  RespCode Result = 1; //结果
}

//游戏服缓存列表请求体
message GameServerCacheListReq {
  repeated int64 GameServerIds = 1 [jstype = JS_STRING]; //游戏服id列表
}
//游戏服缓存列表响应体
message GameServerCacheListResp {
  RespCode Result = 1; //结果
  repeated int64 GameServerIds = 2 [jstype = JS_STRING]; //游戏服id列表
}

//游戏玩家缓存列表请求体
message PlayerCacheListReq {
  int64 GameServerId = 1 [jstype = JS_STRING]; //游戏服务器id
  repeated int64 PlayerIds = 2 [jstype = JS_STRING]; //玩家id列表
  repeated string DisplayIds = 3; //玩家显示id列表
  OnlineState OnlineState = 4; //状态
}
//游戏玩家缓存列表响应体
message PlayerCacheListResp {
  RespCode Result = 1; //结果
  repeated GameServerPlayerData CacheList = 2; //游戏玩家缓存列表
}
//游戏玩家数据结构体
message GameServerPlayerData {
  int64 PlayerId = 1 [jstype = JS_STRING]; //玩家id
  int64 GameServerId = 2 [jstype = JS_STRING]; //游戏服务器id
  int64 SceneId = 3 [jstype = JS_STRING]; //场景id
  int32 CreateTime = 4; //创建时间
  int32 LastJoinTime = 5; //最后进入时间
  string DisplayId = 6; //玩家显示id
  string Name = 7; //玩家名称
  OnlineState OnlineState = 8; //状态
  string SceneName = 9; //场景名称
  int32 MapId = 10; //地图id
}

//设置服务器玩家名称请求体
message InternalSetServerPlayerNameReq {
  string PlayerName = 1; //玩家名称
}
//设置服务器玩家名称响应体
message InternalSetServerPlayerNameResp {
  RespCode Result = 1; //结果
}